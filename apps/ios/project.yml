name: Mote
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MoteKit:
    path: MoteKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mote:
    type: application
    platform: iOS
    sources:
      - App
      - Share/SharePanel.swift
    dependencies:
      - package: MoteKit
        product: MoteDesign
      - package: MoteKit
        product: MoteCore
      - package: MoteKit
        product: MoteCentral
      - package: MoteKit
        product: MoteStorage
      - target: MoteShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mote.ios
        CODE_SIGN_ENTITLEMENTS: App/Mote.entitlements
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_PREPROCESS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描中央生成的连接二维码，或拍摄照片并添加到当前草稿。
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: MOTE_DEVELOPMENT=1
  MoteShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
    dependencies:
      - package: MoteKit
        product: MoteDesign
      - package: MoteKit
        product: MoteCentral
      - package: MoteKit
        product: MoteStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mote.ios.share
        PRODUCT_NAME: MoteShare
        CODE_SIGN_ENTITLEMENTS: Share/MoteShare.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Share/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 保存到 Mote
        SKIP_INSTALL: YES
  MoteUITests:
    type: com.apple.product-type.bundle.ui-testing
    platform: iOS
    sources:
      - MoteUITests
    dependencies:
      - target: Mote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mote.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mote:
    build:
      targets:
        Mote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoteUITests
