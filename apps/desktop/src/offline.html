<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Mote</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f6f2; color: #24231f; }
    @media (prefers-color-scheme: dark) { :root { background: #1c1b18; color: #f2f0e9; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { display: grid; gap: 16px; justify-items: center; padding: 32px; text-align: center; }
    h1 { margin: 0; font-size: 18px; font-weight: 550; }
    button { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 8px; padding: 7px 16px; background: #6f5bd3; color: #fff; font: inherit; cursor: pointer; }
    button:hover { background: #5d49c0; }
  </style>
</head>
<body>
  <main>
    <h1>连接你的 Mote</h1>
    <button id="connect" type="button">连接</button>
  </main>
  <script>
    document.getElementById('connect').addEventListener('click', () => window.moteDesktop?.openLocalWindow());
  </script>
</body>
</html>
