      <figure class="diagram-wrap">

          <defs>

          </defs>
          <text x="14" y="27" class="diagram-copy">记录卡</text>
          <text x="233" y="27" class="diagram-copy">图例</text>
          <rect x="10" y="50" width="127" height="116" rx="12" fill="#e7f4fa" stroke="#146b99" stroke-width="3"/>

          <text x="23" y="111" class="diagram-copy">岚：“我把标记</text>
          <text x="23" y="132" class="diagram-copy">放在桌边。”</text>
          <rect x="10" y="273" width="127" height="116" rx="12" fill="#fff0e4" stroke="#bd5c1f" stroke-width="3"/>
          <text x="23" y="306" class="diagram-label">B · 第三方观察</text>
          <text x="23" y="334" class="diagram-copy">周沐：“我看见标记</text>
          <text x="23" y="355" class="diagram-copy">留在桌边。”</text>
          <rect x="223" y="50" width="127" height="116" rx="12" fill="#fff" stroke="#778fa4" stroke-width="2"/>
          <text x="237" y="82" class="diagram-label">X · 方格图</text>
          <path d="M248 104 H322 M248 124 H322 M267 95 V136 M288 95 V136 M309 95 V136" fill="none" stroke="#497089" stroke-width="2"/>
          <rect x="223" y="273" width="127" height="116" rx="12" fill="#fff" stroke="#778fa4" stroke-width="2"/>
          <text x="237" y="305" class="diagram-label">Y · 圆环图</text>
          <circle cx="286" cy="341" r="25" fill="none" stroke="#497089" stroke-width="3"/>
          <circle cx="286" cy="341" r="5" fill="#497089"/>
          <path id="path-a" d="M137 109 C169 109 191 331 223 331" fill="none" stroke="#146b99" stroke-width="5" marker-end="url(#arrow-blue)"/>
          <path id="path-b" d="M137 331 C169 331 191 109 223 109" fill="none" stroke="#bd5c1f" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#arrow-orange)"/>
          <circle cx="139" cy="109" r="5" fill="#146b99"/>
          <circle cx="139" cy="331" r="5" fill="#bd5c1f"/>
        </svg>
        <figcaption>蓝色实线与橙色虚线各自从一张记录卡出发；交叉处没有合并节点。</figcaption>
