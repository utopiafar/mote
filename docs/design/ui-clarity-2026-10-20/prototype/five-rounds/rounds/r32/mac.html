function translateUI(text,depth=0){
 const raw=String(text??''),key=raw.trim();
 if(!key||depth>3)return raw;
 if(Object.hasOwn(englishLabels,key))return raw.replace(key,englishLabels[key]);
 let m;
  if((m=key.match(/^(\d+) 组 · (\d+) 条片段$/)))return m[1]+' group'+(m[1]==='1'?'':'s')+' · '+m[2]+' snippet'+(m[2]==='1'?'':'s');
  if((m=key.match(/^连续会话 (\d+)$/)))return 'Continuous session '+m[1];
  if((m=key.match(/^(\d+) 条片段$/)))return m[1]+' snippet'+(m[1]==='1'?'':'s');
 if((m=key.match(/^删除“(.+)”这次导入及其生成的 (\d+) 份资料。外部原件与其他导入保留。$/)))return 'Delete the import “'+m[1]+'” and the '+m[2]+' material'+(m[2]==='1'?'':'s')+' it created. External originals and other imports are retained.';
 if((m=key.match(/^已保存：(.+) · ([A-Z]{3}) · 输入 (.+) \/ 输出 (.+) \/ 缓存 (.+)$/)))return 'Saved: '+m[1]+' · '+m[2]+' · Input '+m[3]+' / Output '+m[4]+' / Cache '+m[5];
 if((m=key.match(/^先预览和验证，再单独应用。当前仍运行 (.+)。$/)))return 'Preview and validate first, then apply separately. The active scheme is still '+translateUI(m[1],depth+1)+'.';
 if((m=key.match(/^仅允许读取 (.+)$/)))return 'Read-only access to '+translateUI(m[1],depth+1);
 if((m=key.match(/^待发送 (\d+) 项$/)))return m[1]+' items waiting to send';
 if((m=key.match(/^版本：示例 (.+) · 当前绑定：(.+)$/)))return 'Version: Example '+m[1]+' · Active binding: '+translateUI(m[2],depth+1);
 const enumPrefixes={'目标：':'Target: ','历史范围：':'Historical scope: ','状态：':'Status: ','实例：':'Instance: '};
 for(const [prefix,label] of Object.entries(enumPrefixes))if(key.startsWith(prefix))return label+translateUI(key.slice(prefix.length),depth+1);
 const dataPrefixes={'请求 ':'Request ','示例凭据：':'Example credential: ','日期：':'Date: '};
 for(const [prefix,label] of Object.entries(dataPrefixes))if(key.startsWith(prefix))return label+key.slice(prefix.length);

 if((m=key.match(/^(\d+) 条$/)))return m[1]+' item'+(m[1]==='1'?'':'s');
 if((m=key.match(/^文件 \/ (.+)$/)))return 'File / '+m[1];
 if((m=key.match(/^会话 (.+)$/)))return 'Session '+m[1];
 if((m=key.match(/^打开(.+)$/))&&Object.hasOwn(englishLabels,m[1]))return 'Open '+englishLabels[m[1]];
 if((m=key.match(/^(\d+) 项功能 · 按任务分组$/)))return m[1]+' features · Organized by task';
 if((m=key.match(/^找到 (\d+) 项功能$/)))return m[1]+' matching features';
 if((m=key.match(/^(\d+) 份已保存资料$/)))return m[1]+' saved material'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 个应用$/)))return m[1]+' app'+(m[1]==='1'?'':'s');
 if((m=key.match(/^已保存 (\d+) 个应用：(.+)$/)))return m[1]+' saved apps: '+translateUI(m[2],depth+1);
 if((m=key.match(/^(浏览器|编辑器|即时通讯)(、(?:浏览器|编辑器|即时通讯))+$/)))return key.split('、').map(x=>translateUI(x,depth+1)).join(', ');
 if((m=key.match(/^(屏幕|文件夹)：(.+)$/)))return ({屏幕:'Screen',文件夹:'Folders'})[m[1]]+': '+translateUI(m[2],depth+1);
 if((m=key.match(/^人工纠正 (\d+)$/)))return 'Manual correction '+m[1];
 if((m=key.match(/^移除(.+)$/)))return 'Remove '+m[1];
 if((m=key.match(/^(.+)的回顾$/)))return 'Review · '+translateUI(m[1],depth+1);
 if((m=key.match(/^按保存日期纳入 (\d+) 份资料$/)))return m[1]+' materials included by save date';
 if((m=key.match(/^本次使用的资料 · (\d+) 份$/)))return 'Materials used · '+m[1];
 if((m=key.match(/^(\d+) 份依据$/)))return m[1]+' source'+(m[1]==='1'?'':'s');
 if((m=key.match(/^核对 (\d+) 份原文依据$/)))return 'Check '+m[1]+' original sources';
 if((m=key.match(/^待同步笔记：(\d+) 条$/)))return 'Notes waiting to sync: '+m[1];
 if((m=key.match(/^附图 (\d+) 张$/)))return m[1]+' attached image'+(m[1]==='1'?'':'s');
 if((m=key.match(/^附图：(.+)$/)))return 'Attached images: '+m[1];
 if((m=key.match(/^到期：(.+)$/)))return 'Due: '+m[1];
 if((m=key.match(/^(\d+) 份资料$/)))return m[1]+' material'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 条记录$/)))return m[1]+' record'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 项$/)))return m[1]+' item'+(m[1]==='1'?'':'s');
 if((m=key.match(/^第 (\d+) \/ (\d+) 页$/)))return 'Page '+m[1]+' / '+m[2];
 if((m=key.match(/^(\d+(?:\.\d+)?) 秒$/)))return m[1]+' sec';
 if((m=key.match(/^(\d+)小时\s*(\d+)分$/)))return m[1]+' hr '+m[2]+' min';
 if((m=key.match(/^(\d+)分$/)))return m[1]+' min';
 if((m=key.match(/^(\d+)月(\d+)日[–—-](?:(\d+)月)?(\d+)日$/)))return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[1])-1]+' '+m[2]+'–'+(m[3]?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[3])-1]+' ':'')+m[4];
 if((m=key.match(/^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?) 至 (\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?)$/)))return m[1]+' to '+m[2];
 if((m=key.match(/^(\d+)月(\d+)日(.*)$/)))return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[1])-1]+' '+m[2]+m[3];
 if((m=key.match(/^(今天|昨天)(\s+\d{1,2}:\d{2})$/)))return ({今天:'Today',昨天:'Yesterday'})[m[1]]+m[2];
 if((m=key.match(/^(资料|记忆|洞察) \/ (\d+) 项$/)))return ({资料:'Materials',记忆:'Memories',洞察:'Insights'})[m[1]]+' / '+m[2]+' items';
 if((m=key.match(/^来源连接：(\d+) 项 · 可阅读资料：(\d+) 份$/)))return 'Connected sources: '+m[1]+' · Readable materials: '+m[2];
 if((m=key.match(/^已选择 (\d+) 个应用$/)))return m[1]+' selected app'+(m[1]==='1'?'':'s');
 if((m=key.match(/^屏幕录制权限：(.+)$/)))return 'Screen recording permission: '+translateUI(m[1],depth+1);
 if((m=key.match(/^当前版本 · (.+)$/)))return 'Current version · '+translateUI(m[1],depth+1);
 if((m=key.match(/^进度 (\d+)%$/)))return 'Progress '+m[1]+'%';
 if((m=key.match(/^播放进度 (\d+)%$/)))return 'Playback progress '+m[1]+'%';
 if((m=key.match(/^待你澄清 · (\d+)$/)))return 'Needs clarification · '+m[1];
 if((m=key.match(/^按资料保存日期：(.+)$/)))return 'By material save date: '+translateUI(m[1],depth+1);
 if(key.includes(' → '))return key.split(' → ').map(x=>translateUI(x,depth+1)).join(' → ');
 if(key.includes(' · '))return key.split(' · ').map(x=>translateUI(x,depth+1)).join(' · ');
 return raw;
}
function localizeUI(){
 document.documentElement.lang=state.language==='en'?'en':'zh-CN';
 document.title=state.language==='en'?'Mote · Personal library':'Mote · 个人资料库';
 if(state.language!=='en')return;
 const root=document.getElementById('prototype');
 // Display text must never become an option's business value when language changes.
 root.querySelectorAll('option:not([value])').forEach(option=>option.setAttribute('value',option.textContent));
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
 while(node=walker.nextNode()){
  if(node.parentElement.closest(userContentSelector)||node.parentElement.matches(userTextNodeSelector))continue;
  node.textContent=translateUI(node.textContent);
 }
 root.querySelectorAll('[aria-label],[placeholder],[title]').forEach(element=>{
  if(element.closest('[data-user-content]'))return;
  for(const attr of ['aria-label','placeholder','title']){
   const text=element.getAttribute(attr);if(text)element.setAttribute(attr,translateUI(text));
  }
 });
}

}
function memoryName(kind){return kind==='original'?mcText('产品设计偏好','Product design preference'):mcText('从资料整理的记忆','Memory from materials');}
function memoryVersions(kind){
 const original=kind==='original';
 const first={text:original?originalMemorySeed:(state.generatedMemoryOriginal||state.generatedMemoryText||state.memoryContext),at:original?'2026-10-20T01:30:00.000Z':state.generatedMemoryCreatedAt||null};
 const log=state.memoryVersionLog?.[kind];
 const old=original?state.originalMemoryHistory:state.generatedMemoryHistory;
 const versions=[first,...(log||((old||[]).map(text=>({text,at:null}))))];
 return versions.map((v,i)=>({...v,index:i+1,until:versions[i+1]?.at||null,current:i===versions.length-1}));
}
function recordMemoryVersion(kind,text){

function buildQuestionContext(){
 const question=(document.getElementById('context-question')?.value||'').trim();
 const grants=state.accessGrants.filter(g=>g.active),grant=grants.find(g=>g.id===(document.getElementById('context-preview-grant')?.value||state.contextPreviewGrant))||grants[0];

 if(!grant){notify(mcText('先选择有效的只读授权。','Select an active read-only grant first.'));return;}
 state.contextPreviewGrant=grant.id;
 const chunks=question.toLowerCase().match(/[a-z0-9]{2,}|[\u3400-\u9fff]{2,}/g)||[];
 const terms=[...new Set(chunks.flatMap(x=>/[\u3400-\u9fff]/.test(x)?Array.from({length:Math.max(1,x.length-1)},(_,i)=>x.slice(i,i+2)):[x]))];
 const candidates=state.materials.map(m=>({id:m.id,title:m.title,excerpt:m.body,page:'material/'+m.id}));
 if(grant.scope.includes('记忆'))for(const kind of memoryKinds())candidates.push({id:'memory-'+kind,title:memoryName(kind),excerpt:memoryVersions(kind).at(-1).text,page:'memories'});
 if(grant.scope.includes('洞察'))for(const r of state.insightReports)candidates.push({id:r.id,title:r.question,excerpt:r.question+' · '+r.dates,page:'insights'});
 const items=candidates.map(c=>({...c,score:terms.filter(term=>(c.title+' '+c.excerpt).toLowerCase().includes(term)).length})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(({score,...c})=>({...c,excerpt:c.excerpt.slice(0,240)}));

}

function currentNoteRecord(){
 const id=state.noteDraftId||state.noteSaved||('note-'+Date.now()+'-'+(++state.noteSequence));

 return {id,title:state.note.trim().split('\n')[0].slice(0,36)||'带附件的笔记',type:'note',source:'随手记',date:'刚刚',preview:state.note.slice(0,80),text:state.note,attachments:[...state.attachments],body:state.note+(state.attachments.length?'\n附件：'+state.attachments.join('、'):''),device:state.surface==='web'?'网页':state.surface==='mac'?'Mac':'Android',origin:'我写的记录'};

function commitNoteRecord(note){
 const previous=state.materials.findIndex(m=>m.id===note.id);
 if(previous>=0)state.materials[previous]={...note};else state.materials.unshift({...note});
 state.noteQueue=state.noteQueue.filter(item=>item.id!==note.id);
 if(state.noteDraftId===note.id){state.noteSaved=note.id;state.noteQueued=null;state.noteDirty=false;}
}
function saveCurrentNote(){
 if(!state.note.trim()&&!state.attachments.length)return notify('先写一点内容或添加附件。');
 const note=currentNoteRecord();
 if(state.noteNetwork==='offline'){
  const item={...note,status:'pending'},index=state.noteQueue.findIndex(q=>q.id===note.id);
  if(index>=0)state.noteQueue[index]=item;else state.noteQueue.unshift(item);
  state.noteQueued=note.id;state.noteDirty=false;persist();return notify('已保存在本机待同步队列，恢复连接后可重试同步。');
 }
 commitNoteRecord(note);persist();return notify('笔记已保存到资料库。','material/'+note.id);
}

 if(action==='confirm-discard-note'&&q){state.noteQueue=state.noteQueue.filter(item=>item.id!==q.id);if(state.noteDraftId===q.id){const saved=state.materials.find(m=>m.id===q.id);state.note=saved?.text||'';state.attachments=[...(saved?.attachments||[])];state.noteSaved=saved?.id||null;state.noteDraftId=saved?.id||null;state.noteQueued=null;state.noteDirty=false;}state.modal='';persist();notify('本机待同步副本已丢弃，已保存资料保持不变。');return true;}
 return false;
}

document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(e.target.dataset.screenApp){readScreenDraft();persist();render();return;}if(id.startsWith('usage-')&&['period','module','model','status'].includes(id.slice(6))){state.usageFilters[id.slice(6)]=v;state.usagePage=0;render();}if(id==='usage-group'){state.usageGroup=v;render();}if(id==='space-period'){state.spacePeriod=v;render();}if(id==='todo-filter'){state.todoFilter=v;render();}if(id==='coding-client'){state.codingClient=v;render();}if(id==='compact-collection'){doAction('filter',{dataset:{filter:v},textContent:e.target.selectedOptions[0].textContent});}if(id==='compact-settings'){go('settings/'+v);}if(id==='date-filter'){state.dateFilter=v;render();}if(id==='preview-surface'){state.surface=v;render();}if(id==='preview-theme'||id==='appearance-choice'){state.theme=v;persist();render();}if(id==='preview-state'){resetPreviewData(v);}if(id==='insight-range'){state.insightRange=v;persist();render();}if(id==='ask-scope'){state.askScope=v;persist();render();}if(id==='device-filter'){state.deviceFilter=v;persist();render();}if(id==='capture-date-filter'){state.captureDateFilter=v;persist();render();}if(id==='snippet-grouping'){state.snippetGrouping=v;persist();render();}if(id==='source-filter'){state.sourceScopeId=v.startsWith('id:')?v.slice(3):'';state.sourceFilter=state.sourceScopeId?'all':v;persist();render();}if(id==='type-filter'){state.typeFilter=v;render();}if(id==='library-tools'||id==='source-tools'){if(v)go(v);}if(id==='language-choice'){state.language=v;state.toast='界面语言已切换，已保存的资料保留原文。';persist();render();}});
window.addEventListener('resize',()=>{clearTimeout(window.moteResizeTimer);window.moteResizeTimer=setTimeout(render,120);});

document.addEventListener('keydown',e=>{if(!state.authenticated&&e.key==='Enter'&&e.target.matches('#demo-username,#demo-password')){e.preventDefault();accountAction('demo-login');return;}const dialog=document.querySelector('[role=dialog]');if(e.key==='Escape'&&dialog){e.preventDefault();state.modal='';render();return;}if(e.key==='Tab'&&dialog){const options=[...dialog.querySelectorAll('button,a[href],input,textarea,select,summary,[tabindex]')].filter(el=>el.tabIndex>=0&&availableControl(el));if(options.length){e.preventDefault();const i=options.indexOf(document.activeElement),next=i<0?(e.shiftKey?options.length-1:0):(i+(e.shiftKey?-1:1)+options.length)%options.length;options[next].focus();}return;}if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...e.target.closest('[role=tablist]').querySelectorAll('[role=tab]')],index=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowLeft'?-1:1)+tabs.length)%tabs.length,id=tabs[next].dataset.tab;tabs[next].click();document.querySelector('[role=tab][data-tab="'+id+'"]')?.focus();return;}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!dialog){e.preventDefault();if(pageMain()==='notes')doAction('save-note');if(pageMain()==='ask')doAction('send-ask');}});

<script>state.surface=window.MOTE_SURFACE;</script>
<script data-iteration-layer="common.js">
/* Shared UI iteration layer. R19 stays frozen; every round snapshots this file. */
'use strict';
const nuText=(zh,en)=>state.language==='en'?en:zh;
const nuBaseRender=render;
const nuBaseLibrary=libraryPage;
const nuBaseNotes=notesPage;
const nuBaseAsk=askPage;
const nuBaseReset=resetPreviewData;
const nuBaseGo=go;
const nuBaseSetup=setupPage;
const nuBaseDoAction=doAction;
const nuBaseMaterialRow=materialRow;
const nuBaseDevices=devicesPage;
const nuBaseNoteRecord=currentNoteRecord;

const nuAction=(label,action,kind='subtle',extra='')=>button(label,'nu-'+action,extra,kind);
go=function(page){if(state.surface==='web'&&page==='setup/folder'&&!state.sources.some(s=>s.id==='folder'))page='setup/folder/new';if(page!==state.page){state.toast='';state.toastAction='';if(state.page==='setup/device')state.nuSetupReturn='';}return nuBaseGo(page);};

function webScreenSetup(){
 const connected=state.devices.filter(d=>['Mac','Android'].includes(d.platform));
 const chosen=connected.find(d=>d.id===state.nuScreenTarget)||connected[0];
 const title=heading(nuText('设备的屏幕记录','Screen capture on your devices'),nuText('由设备采集，保存后在资料库中查找和使用。','Captured on your device, then available in your library.'),goButton(nuText('返回来源','Back to sources'),'sources','subtle'));
 if(!chosen)return title+'<section class="card reading device-first"><span class="step-number">1</span><h2>'+nuText('先连接一台 Mac 或 Android 设备','Connect a Mac or Android device first')+'</h2><p>'+nuText('屏幕记录需要设备上的 Mote 客户端和系统授权。连接后，这里会显示设备及记录状态。','Screen capture needs the Mote app and system permission on that device. Its connection and capture status will appear here.')+'</p><div class="actions section">'+nuAction(nuText('连接设备','Connect a device'),'connect-screen','primary')+goButton(nuText('先写一条记录','Start with a note'),'notes','subtle')+'</div></section>';
 const source=state.sources.find(s=>s.id==='screen'&&(s.deviceId||'mac')===chosen.id);
 return title+'<section class="card reading device-first"><div class="section-head"><div><p class="eyebrow">'+nuText('当前目标设备','CURRENT DEVICE')+'</p><h2 data-user-content>'+esc(chosen.name)+'</h2></div>'+tag(chosen.platform,'purple')+'</div>'+(connected.length>1?'<label class="field"><span>'+nuText('查看设备','View device')+'</span><select class="field-input" id="nu-screen-device">'+connected.map(d=>'<option value="'+esc(d.id)+'" '+(d.id===chosen.id?'selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></label>':'')+'<div class="notice section"><div><strong>'+nuText('应用范围与系统权限，在这台设备上设置','Set app scope and system permission on this device')+'</strong><p>'+nuText('打开设备上的 Mote → 来源 → 屏幕记录，选择应用并确认。你随时可以在该设备暂停。','Open Mote on the device → Sources → Screen capture. Choose apps and confirm. You can pause on the device at any time.')+'</p></div></div><section class="section"><h3>'+nuText('设备上报的记录状态','Capture status reported by the device')+'</h3><p>'+esc(source?sourceStatusMessage(source.id,source):nuText('还没有上报记录范围。完成设备端设置后，可以回来查看。','No capture scope has been reported yet. Return after setting it up on the device.'))+'</p>'+(source?'<p>'+nuText('已保存应用：','Saved apps: ')+esc(screenAppNames(savedScreenApps()))+'</p>':'')+'</section><div class="actions section">'+goButton(nuText('查看设备状态','View device status'),'devices','primary')+goButton(nuText('返回来源','Back to sources'),'sources','subtle')+'</div></section>';
}
function webFolderSetup(){
 const id=state.page.split('/')[2]||'folder',existing=state.sources.find(s=>s.id===id),config=state.sourceConfigs?.[id]||{};
 const nativeSource=existing&&config.location!=='workspace';
 if(nativeSource||(!existing&&state.nuFolderDevice)){
  const device=state.devices.find(d=>d.id===(existing?(existing.deviceId||'mac'):state.nuFolderDevice));
  const name=device?.name||nuText('来源所在的设备','The source device');
  return heading(nuText('设备上的文件夹','Folders on a device'),nuText('在对应设备选择目录，再由工作台汇集保存结果。','Choose the folder on that device. Saved results are collected in your workspace.'),goButton(nuText('返回来源','Back to sources'),'sources','subtle'))+'<section class="card reading device-first"><p class="eyebrow">'+nuText('目标设备','TARGET DEVICE')+'</p><h2 data-user-content>'+esc(name)+'</h2>'+(existing?'<p data-user-content>'+esc(existing.title)+'</p>':'')+'<div class="notice section"><div><strong>'+nuText('在设备上完成文件夹授权与范围设置','Choose the folder and grant access on the device')+'</strong><p>'+nuText('打开这台设备的 Mote → 来源 → 文件夹同步。选择一个目录，确认保存方式，随时可以在设备端暂停。','Open Mote on this device → Sources → Folder sync. Choose a folder and storage mode. You can pause it from that device at any time.')+'</p></div></div><div class="actions section">'+goButton(nuText('查看设备状态','View device status'),'devices','primary')+nuAction(nuText('改为工作台服务器目录','Use a workspace server folder'),'folder-server','subtle')+'</div></section>';
 }
 return nuBaseSetup();
}
setupPage=function(){if(state.surface==='web'){if(state.page==='setup/screen')return webScreenSetup();if(state.page.startsWith('setup/folder'))return webFolderSetup();}return nuBaseSetup();};
devicesPage=function(){
 let html=nuBaseDevices();
 const replacements=[
  ['设备与记录状态',nuText('设备连接与采集状态','Device connection and capture status')],
  ['工作台是资料汇集的位置。设备决定记录哪些本机内容；来源管理决定每种内容怎样接入。',nuText('工作台汇集各设备保存的资料。设备连接授权允许同步到当前工作台；屏幕录制权限需在设备的系统设置中单独开启。','Your workspace collects saved materials from your devices. Device connection authorization allows workspace sync; screen recording needs a separate permission in the device’s system settings.')],
  ['重新授权这台设备',nuText('更新设备连接授权','Renew device connection authorization')],
  ['授权已更新',nuText('设备连接授权已更新','Device connection authorization renewed')],
  ['未在记录 · 等待授权',nuText('未在记录 · 等待系统屏幕权限','Not recording · waiting for system screen permission')],
  ['未在记录 · 权限已拒绝',nuText('未在记录 · 系统屏幕权限被拒绝','Not recording · system screen permission denied')],
  ['向中央发送已暂停',nuText('向工作台同步已暂停','Sync to this workspace is paused')],
  ['向中央发送已开启',nuText('向工作台同步已开启','Sync to this workspace is on')],
  ['资料正文可阅读，记忆整理单独进行。',nuText('资料保存后即可阅读。长期要点会在后台整理为记忆。','Saved materials are ready to read. Longer-term facts are organized into memories in the background.')]
 ];
 for(const [from,to] of replacements)html=html.split(from).join(to);
 return html;
};
doAction=function(action,el){
 if(action==='connect-device'&&['screen','folder'].includes(state.nuSetupReturn)){
  const intent=state.nuSetupReturn,target=el.dataset.device.toLowerCase();state.nuSetupReturn='';nuBaseDoAction(action,el);
  if(intent==='screen')state.nuScreenTarget=target;else state.nuFolderDevice=target;
  persist();go(intent==='screen'?'setup/screen':'setup/folder/new');return;
 }
 if(action==='save-source'&&state.surface==='web'&&el.dataset.kind==='folder'){
  const before=new Set(state.sources.map(s=>s.id)),requested=el.dataset.id;
  nuBaseDoAction(action,el);
  const source=state.sources.find(s=>!before.has(s.id)&&sourceKind(s.id)==='folder')||state.sources.find(s=>s.id===requested);
  if(source){const cfg=state.sourceConfigs[source.id]||{};state.sourceConfigs[source.id]={...cfg,location:'workspace'};source.subtitle='工作台服务器 · '+(cfg.folderPath||'');source.deviceId='workspace';persist();render();}
  return;
 }
 return nuBaseDoAction(action,el);
};
materialRow=function(material){
 const html=nuBaseMaterialRow(material),query=(state.search||'').trim();
 if(!query)return html;
 const body=String(material.body||''),at=body.toLocaleLowerCase().indexOf(query.toLocaleLowerCase());
 if(at<0)return html;
 const start=Math.max(0,at-8),end=Math.min(body.length,at+query.length+85);
 const excerpt=(start?'…':'')+esc(body.slice(start,at))+'<mark>'+esc(body.slice(at,at+query.length))+'</mark>'+esc(body.slice(at+query.length,end))+(end<body.length?'…':'');
 return html.replace(/<span class="material-preview">[\s\S]*?<\/span>/,'<span class="material-preview material-match"><span class="match-label">'+nuText('正文命中','Found in the note')+'</span><span data-user-content>'+excerpt+'</span></span>');
};
currentNoteRecord=function(){
 const record=nuBaseNoteRecord(),previous=state.materials.find(m=>m.id===record.id)||state.noteQueue.find(m=>m.id===record.id);
 const date=new Date(),now=date.toISOString(),day=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
 return {...record,createdAt:previous?.createdAt||now,updatedAt:now,saved:previous?.saved||day};
};

function enhanceOriginalEvidence(){
 const material=state.original;
 if(state.modal!=='original'||!material||material.type==='screen')return;
 const box=document.querySelector('.modal .evidence-box');
 if(!box||box.querySelector('.original-metadata'))return;
 const recorded=material.updatedAt||material.createdAt;
 let when=material.date||nuText('未提供','Not provided');
 if(recorded&&!Number.isNaN(new Date(recorded).getTime()))when=new Intl.DateTimeFormat(state.language==='en'?'en-GB':'zh-CN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(recorded));
 else if(when==='刚刚')when=nuText('刚刚（示例记录）','Just now (sample record)');
 const source=material.source||material.origin||nuText('未提供','Not provided');
 const device=material.device==='网页'?nuText('网页工作台','Web workspace'):material.device;
 const details='<dl class="original-metadata"><div><dt>'+nuText('内容来源','Content source')+'</dt><dd data-user-content>'+esc(source)+'</dd></div><div><dt>'+nuText(recorded?'保存时间（本地）':material.type==='calendar'?'事件时间':'记录时间',recorded?'Saved at (local time)':material.type==='calendar'?'Event time':'Recorded time')+'</dt><dd><time'+(recorded?' datetime="'+esc(recorded)+'"':'')+'>'+esc(when)+'</time></dd></div><div><dt>'+nuText('存入资料库日期','Added to the library')+'</dt><dd><time datetime="'+esc(materialSavedDate(material))+'">'+esc(materialSavedDate(material))+'</time></dd></div>'+(device?'<div><dt>'+nuText('保存端','Saved from')+'</dt><dd data-user-content>'+esc(device)+'</dd></div>':'')+'</dl>';
 box.querySelector('strong')?.insertAdjacentHTML('afterend',details);

function enhanceEvidenceDates(){
 if(state.page.startsWith('material/')){
  const material=state.materials.find(m=>m.id===state.page.split('/')[1]),meta=document.querySelector('.reading-meta');
  if(material&&meta){const dateSpan=meta.querySelectorAll(':scope > span')[1];if(dateSpan)dateSpan.textContent=nuText(material.type==='calendar'?'事件时间：':'记录时间：',material.type==='calendar'?'Event time: ':'Recorded time: ')+material.date;meta.insertAdjacentHTML('beforeend','<span class="material-saved-date">'+nuText('存入资料库：','Added to library: ')+'<time datetime="'+esc(materialSavedDate(material))+'">'+esc(materialSavedDate(material))+'</time></span>');}
 }
 const list=document.querySelector('.insight-sources > .actions'),report=state.insightReports.find(r=>r.id===state.currentInsightId);
 if(!list||!report)return;
 const materials=(report.ids||[]).map(id=>state.materials.find(m=>m.id===id)).filter(Boolean);
 list.classList.add('insight-evidence-list');

 if(materials.some(m=>m.type==='calendar'))list.insertAdjacentHTML('beforebegin','<p class="small muted">'+nuText('纳入范围使用资料存入日期；日程另列事件发生时间。','Inclusion uses the date added to the library. Calendar items list their event time separately.')+'</p>');

function enhanceFolderSaveMode(){

 if(!state.page.startsWith('setup/folder')||!select)return;

  ['中央保留原件，本机按需清理',nuText('工作台保留原件，清理 Mote 暂存副本','Keep originals in the workspace; clear Mote staging copies')],

  nuText('工作台确认收到后，可清理 Mote 生成的待传副本。你选择的文件夹中的原文件保留。','After the workspace confirms receipt, Mote’s staging copies can be cleared. Original files in the folder you selected remain there.'),
  nuText('保留 Mote 的本机副本和工作台归档。你选择的文件夹中的原文件保持原样。','Keep Mote’s local copies and the workspace archive. Original files in your selected folder stay unchanged.'),

 ];

function enhanceWebFolderTarget(){
 if(state.surface!=='web')return;
 document.querySelectorAll('.source-row[data-source-id]').forEach(row=>{const id=row.dataset.sourceId,cfg=state.sourceConfigs?.[id];if(cfg?.location==='workspace'){const text=row.querySelector('.source-main p');if(text)text.textContent=nuText('工作台服务器 · ','Workspace server · ')+(cfg.folderPath||'');}});

 if(headingEl)headingEl.textContent=nuText(existing?'管理工作台服务器文件夹':'连接工作台服务器文件夹',existing?'Manage a workspace server folder':'Connect a workspace server folder');
 if(description)description.textContent=nuText(existing?'查看这个服务器目录的范围、保存方式与接收状态。':'连接当前工作台服务器能访问的目录，持续保存后续变化。',existing?'Review this server folder’s scope, storage and receiving state.':'Connect a folder accessible to the current workspace server and keep later changes.');

function clarifyFolderLocationCopy(){

        if(path){path.placeholder=tr('选择手机上的一个目录','Choose a folder on this phone');const label=path.closest('label');const caption=label?.querySelector('span');if(caption)caption.textContent=tr('手机文件夹','Phone folder');const help=label?.querySelector('small');if(help)help.textContent=tr('只访问你选择的目录。','Only the selected folder is accessible.');if(label)label.insertAdjacentHTML(existing?'afterend':'beforebegin',action(icon('folder')+' '+tr('选择手机文件夹','Choose phone folder'),'native-folder-picker','btn native-folder-picker'+(existing?'':' primary')));}
        fields.querySelectorAll('p').forEach(p=>{if(p.textContent.includes('本机指这台电脑')||p.textContent.includes('local means this computer'))p.textContent=tr('中央指你的 Mote 工作台存储；本机指这台手机。保存方式决定两处是否保留原件。','Central means your Mote workspace storage; local means this phone. The save mode determines where originals are retained.');});

      }else{
        const key=folderRouteKey(),parts=state.page.split('/'),creating=parts[2]==='new',id=creating?'':parts[2]||'folder',existing=state.sources.find(s=>s.id===id),draft=state.nativeFolderDrafts?.[key];
        const titleEl=document.querySelector('main .page-heading h1'),descEl=document.querySelector('main .page-heading p');

        else if(!existing){if(path)path.value='';if(name)name.value='';}
        if(path){path.placeholder=tr('选择这台 Mac 上的一个文件夹','Choose a folder on this Mac');const label=path.closest('label'),caption=label?.querySelector('span');if(caption)caption.textContent=tr('Mac 文件夹','Mac folder');const help=label?.querySelector('small');if(help)help.textContent=tr('仅同步所选文件夹；路径可在这里核对。','Sync only the selected folder; review its path here.');if(label)label.insertAdjacentHTML('afterend',action(icon('folder')+' '+tr('在 Finder 中选择','Choose in Finder'),'native-folder-picker','btn native-folder-picker'));}
        if(!existing){const continuous=document.getElementById('continuous')?.closest('label')?.querySelector('small');if(continuous)continuous.textContent=tr('连接后接收这个文件夹的后续变化。暂停时保留已有资料。','Receive later changes after connecting. Pausing keeps saved materials.');}

  }
  function sourceControlFeedback(){
    if(!state.page.startsWith('setup/'))return;
    const parts=state.page.split('/'),kind=parts[1],id=kind==='folder'?(parts[2]||'folder'):kind;
    if(!['folder','screen'].includes(kind)||id==='new')return;
    const source=state.sources.find(s=>s.id===id),actions=document.querySelector('main > .fields > .form-actions');
    if(!source||!actions||document.querySelector('[data-native-source-feedback]'))return;
    if(state.setupSaved[id]){
      const savedText=state.language==='en'?translateUI(state.setupSaved[id]):state.setupSaved[id];
      document.querySelectorAll('main > .fields > .notice.good:not([data-source-receiving])').forEach(el=>{if(el.innerText.trim()===savedText)el.remove();});
    }
    const paused=!!state.sourcePaused[id],continuous=state.sourceConfigs?.[id]?.continuous!==false;
    const status=sourceStatus(id,source),label=state.language==='en'?translateUI(status):status;
    let message='',quiet=paused;
    if(kind==='folder'){
      message=paused?tr('当前暂停接收。已有资料仍可阅读，已保存的同步策略保留。','Receiving is paused. Saved materials remain readable, and the saved sync policy is retained.'):continuous?tr('正在按已保存的策略接收目录变化。可以单独暂停这个来源。','Receiving folder changes using the saved policy. You can pause this source separately.'):tr('已连接，暂不持续接收后续变化。调整同步策略并保存后生效。','Connected, with continuous receiving off. Change and save the sync policy to enable it.');
      quiet=paused||!continuous;
      const input=document.getElementById('continuous'),caption=input?.closest('label')?.querySelector('span');
      if(caption)caption.innerHTML=tr('同步策略：持续同步后续变化','Sync policy: continuously receive later changes')+'<small>'+tr('已保存的策略：'+(continuous?'持续同步':'不持续接收')+'。暂停时保留；修改勾选后点击“保存设置”生效。','Saved policy: '+(continuous?'continuous sync':'continuous receiving off')+'. Pausing retains this setting; changes take effect after Save settings.')+'</small>';
    }else{
      if(state.permission!=='已授权'){
        quiet=true;message=tr('当前不会记录屏幕。需要允许系统权限并保存应用范围。','Screen recording is off. Allow system permission and save the app scope first.')+(paused?tr(' 此来源也处于暂停状态。',' This source is also paused.'):'');
      }else message=paused?tr('当前暂停屏幕记录。已保存的应用范围和已有资料保留。','Screen recording is paused. The saved app scope and existing materials are retained.'):tr('正在按已保存的应用范围记录。修改应用勾选后需要保存范围。','Recording the saved app scope. Save the scope after changing app selections.');
    }
    actions.insertAdjacentHTML('beforebegin','<section class="native-source-feedback '+(quiet?'is-paused':'is-receiving')+'" data-native-source-feedback role="status" aria-live="polite"><div><span class="native-source-feedback-dot"></span><strong>'+tr('当前状态：','Current state: ')+esc(label)+'</strong></div><p>'+message+'</p></section>');
  }
  function refineExistingSourceLayout(){
    if(!state.page.startsWith('setup/'))return;
    const parts=state.page.split('/'),kind=parts[1],id=kind==='folder'?(parts[2]||'folder'):kind;
    const webWorkspace=state.surface==='web'&&kind==='folder'&&state.sourceConfigs?.[id]?.location==='workspace';
    if((!isMac()&&!isAndroid()&&!webWorkspace)||!['folder','screen'].includes(kind)||id==='new')return;
    const source=state.sources.find(s=>s.id===id),fields=document.querySelector('main > .fields'),feedback=fields?.querySelector('[data-native-source-feedback]');
    if(!source||!fields||!feedback||fields.querySelector('.native-current-source'))return;
    fields.classList.add('native-existing-source');
    const current=document.createElement('section');current.className='native-current-source';current.setAttribute('aria-label',tr('当前来源状态与范围','Current source state and scope'));
    const controls=document.createElement('div');controls.className='native-current-actions';
    const pause=fields.querySelector(':scope > .form-actions [data-action="pause-source"]'),browse=fields.querySelector(':scope > [data-action="browse-source"]');
    if(pause)controls.append(pause);if(browse)controls.append(browse);
    const scope=fields.querySelector(kind==='screen'?'[data-saved-screen-range]':':scope > .evidence-box');
    if(kind==='folder'&&scope){
      const cfg=state.sourceConfigs?.[id]||{},savedPath=cfg.folderPath||source.subtitle.replace(/^(Mac|Android) · /,'');
      scope.classList.add('native-saved-folder');
      scope.innerHTML='<h2>'+tr(webWorkspace?'已连接的工作台服务器文件夹':'已连接的文件夹',webWorkspace?'Connected workspace server folder':'Connected folder')+'</h2><p data-user-content><strong>'+esc(source.title)+'</strong><span>'+esc(savedPath)+'</span></p>';
    }
    feedback.append(controls);current.append(feedback);if(scope)current.append(scope);
    fields.querySelector(':scope > [data-source-receiving]')?.remove();
    const context=fields.querySelector(':scope > .native-setup-context');
    if(context){
      const help=document.createElement('details');help.className='native-setup-help';
      help.innerHTML='<summary>'+tr(kind==='screen'?'权限与收集说明':'文件夹访问说明',kind==='screen'?'Permission and capture help':'Folder access help')+'</summary>';
      help.append(context);
      if(kind==='screen'&&state.permission==='已授权'){
        const permission=[...fields.querySelectorAll(':scope > .notice')].find(el=>el.querySelector('[data-action="allow-screen"]'));
        if(permission)help.append(permission);
      }
      fields.prepend(help);
    }
    fields.prepend(current);
    if(kind==='folder'){
      const path=fields.querySelector('#folder-path')?.closest('label');
      if(path)path.insertAdjacentHTML('beforebegin','<h2 class="native-edit-heading">'+tr('修改范围与保存设置','Edit scope and storage settings')+'</h2>');
    }
  }
  function refreshRelationshipSummary(panel){
    const id=panel.dataset.sourceContextId,details=panel.closest('.native-context-disclosure'),summary=details?.querySelector(':scope > summary');
    if(!summary)return;
    const saved=savedSourceContext(id),dirty=sourceContextDirty(id),hasSaved=!!(saved.ownerRelation||saved.contextDescription);
    const labels={'':['不声明','No declaration'],owner:['我的表达或经历','My own expression or experience'],third_party:['第三方内容','Third-party content'],mixed:['混合内容','Mixed content'],unknown:['归属未知','Ownership unknown']},label=labels[saved.ownerRelation]||labels[''];
    summary.querySelector('.native-context-saved-label').textContent=hasSaved?tr('已保存：','Saved: ')+tr(label[0],label[1])+(saved.contextDescription?tr(' · 已补充背景',' · background added'):''):tr('尚未声明，仍可查询与整理','No declaration yet; search and organize normally');
    const status=summary.querySelector('.native-context-save-status');status.textContent=dirty?tr('有未保存修改','Unsaved changes'):hasSaved?tr('已保存','Saved'):tr('选填','Optional');status.classList.toggle('has-draft',dirty);
  }
  function refineSourceRelationship(){
    document.querySelectorAll('main [data-source-context-id]').forEach(panel=>{
      if(panel.closest('.native-context-disclosure')){refreshRelationshipSummary(panel);return;}
      const details=document.createElement('details');details.className='native-context-disclosure';details.open=sourceContextDirty(panel.dataset.sourceContextId);
      details.innerHTML='<summary><span><strong>'+tr('内容关系与背景','Content relationship and background')+'</strong><small class="native-context-saved-label"></small></span><span class="native-context-save-status" role="status" aria-live="polite"></span></summary>';
      panel.before(details);details.append(panel);panel.querySelector(':scope > h2')?.remove();refreshRelationshipSummary(panel);
    });
  }
  function screenSaveRecovery(){
    if(state.page!=='setup/screen'||state.permission==='已授权')return;
    const save=document.querySelector('main [data-action="save-source"][data-kind="screen"]'),actions=save?.closest('.form-actions');
    if(!save?.disabled||!actions||document.querySelector('.native-permission-reminder'))return;
    save.setAttribute('aria-describedby','native-screen-save-reason');
    actions.insertAdjacentHTML('beforebegin','<section class="native-permission-reminder"><div><strong>'+tr('需要先允许屏幕录制','Allow screen recording first')+'</strong><p id="native-screen-save-reason">'+tr('屏幕权限尚未允许，当前不能保存记录范围。应用勾选已保留。','Screen permission is not allowed yet, so the recording scope cannot be saved. Your app selection is retained.')+'</p></div>'+action(tr('去查看屏幕权限','Review screen permission'),'native-permission-control','btn')+'</section>');
  }
  window.enhancePlatformUI=function(){
    document.body.dataset.surface=state.surface;
    if(!isMac()&&!isAndroid()){sourceControlFeedback();refineExistingSourceLayout();refineSourceRelationship();screenSaveRecovery();return;}
    if(adaptAndroidFixtures()){render();return;}
    const app=document.querySelector('.app');
    if(!app)return;
    const changedPage=native.lastPage!==state.page;
    if(changedPage){
      const completedFolder=native.lastPage==='setup/folder/new'&&state.page.startsWith('setup/folder/')&&state.page!=='setup/folder/new'&&state.sources.some(s=>sourceSetupRoute(s.id)===state.page);
      if(completedFolder&&state.nativeFolderDrafts)delete state.nativeFolderDrafts['setup/folder/new'];
      if(native.lastPage&&!native.popping&&!completedFolder)native.routes.push(native.lastPage);
      native.lastPage=state.page;native.popping=false;native.menuOpen=false;
    }
    document.querySelectorAll('[data-native-chrome],.native-menu-popover').forEach(el=>el.remove());
    if(isMac()){
      app.insertAdjacentHTML('beforebegin',macChrome());
      const nav=document.querySelector('.sidebar > nav');
      if(nav&&!document.querySelector('.native-mac-quick'))nav.insertAdjacentHTML('afterend','<div class="native-mac-quick"><span>'+tr('本机快捷操作','ON THIS MAC')+'</span>'+route(icon('note')+tr('写随手记','Quick note')+'<kbd>⌘ N</kbd>','notes','native-quick-link')+route(icon('folder')+tr('同步文件夹','Sync a folder'),'setup/folder/new','native-quick-link')+'</div>');
    }else{
      app.insertAdjacentHTML('beforebegin',androidStatusbar());
      const top=document.querySelector('.mobile-top');if(top)top.innerHTML=mobileAppbar();
      const bottom=document.querySelector('.bottom-nav');if(bottom)bottom.insertAdjacentHTML('beforeend','<div class="native-gesture-area" aria-hidden="true"><span></span></div>');
      const welcomePaths=document.querySelector('.welcome-paths'),welcomeExample=document.querySelector('.welcome-example');
      if(welcomePaths&&welcomeExample){welcomePaths.insertAdjacentElement('afterend',welcomeExample);welcomeExample.classList.add('native-later-example');}
      document.querySelectorAll('.source-row').forEach(row=>{const s=state.sources.find(s=>s.id===row.dataset.sourceId);const p=row.querySelector('.source-main p');if(p&&s&&sourceKind(s.id)==='folder')p.textContent='Android · '+(state.sourceConfigs?.[s.id]?.folderPath||s.subtitle.replace(/^(Mac|Android) · /,''));});
    }
    if(state.page==='sources'||state.page==='catalog'){
      const heading=document.querySelector('main > .page-heading');
      if(heading&&!document.querySelector('.native-device-panel'))heading.insertAdjacentHTML('afterend',devicePanel());
    }
    setupAdaptation();
    sourceControlFeedback();
    refineExistingSourceLayout();
    refineSourceRelationship();
    screenSaveRecovery();
    if((isAndroid()||isMac())&&!state.sources.some(s=>s.id==='folder'))document.querySelectorAll('[data-action="go"][data-page="setup/folder"]').forEach(el=>el.dataset.page='setup/folder/new');
    if(state.modal)document.querySelectorAll('[data-native-chrome],.native-menu-popover').forEach(el=>{el.inert=true;el.setAttribute('aria-hidden','true');});
    if(isAndroid()&&changedPage)window.scrollTo(0,0);
  };
  window.platformAction=function(name,el){
    if(!name.startsWith('native-'))return false;
    if(name==='native-permission-control'){
      const allow=document.querySelector('main [data-action="allow-screen"]'),help=allow?.closest('details'),permission=allow?.closest('.notice');
      if(help)help.open=true;
      if(permission){permission.classList.add('native-permission-focus');permission.scrollIntoView({block:'center'});}
      allow?.focus({preventScroll:true});return true;
    }
    if(name==='native-menu-toggle'){native.menuOpen=!native.menuOpen;render();return true;}
    if(name==='native-menu-close'){native.menuOpen=false;render();return true;}
    if(name==='native-folder-list'){
      go('sources');const folderIds=state.sources.filter(s=>sourceKind(s.id)==='folder').map(s=>s.id);const row=[...document.querySelectorAll('.source-row')].find(el=>folderIds.includes(el.dataset.sourceId));row?.scrollIntoView({block:'start'});return true;
    }
    if(name==='native-folder-picker'){
      readFolderDraft();
      const choices=isAndroid()?[['Documents/阅读资料','阅读资料','Reading materials'],['Download/收集夹','收集夹','Collected files']]:[['~/Documents/阅读资料','阅读资料','Reading materials'],['~/Desktop/收集夹','收集夹','Collected files']];
      const rows='<div class="native-folder-options">'+choices.map(([folder,zh,en])=>action(icon('folder')+'<span><strong>'+esc(tr(zh,en))+'</strong><small data-user-content>'+esc(folder)+'</small></span>','native-folder-selected','native-folder-option','data-folder="'+esc(folder)+'" data-name="'+esc(tr(zh,en))+'"')).join('')+'</div>';
      const picker=isMac()?'<div class="native-finder-picker"><aside><strong>'+tr('位置','Locations')+'</strong><span>'+icon('folder')+tr('文稿','Documents')+'</span><span>'+icon('screen')+tr('桌面','Desktop')+'</span></aside>'+rows+'</div>':rows;
      showInfo(tr('选择示例文件夹','Choose a sample folder'),isAndroid()?tr('Android 文件选择器 · 预览授权范围','Android folder picker · preview access scope'):tr('Finder · 预览所选文件夹','Finder · preview the selected folder'),'<p class="small muted">'+tr('选定一个目录后，Mote 只接收该目录中的变化。','Mote receives changes from the selected folder only.')+'</p>'+picker);return true;
    }
    if(name==='native-folder-selected'){
      const key=folderRouteKey(),draft={...(state.nativeFolderDrafts?.[key]||{}),folderPath:el.dataset.folder};
      if(!draft.name)draft.name=el.dataset.name;
      state.nativeFolderDrafts={...(state.nativeFolderDrafts||{}),[key]:draft};if(key==='setup/folder/new')state.newFolderDraft={...draft};
      state.modal='';persist();render();return true;
    }
    if(name==='native-search'){
      if(!state.materials.length){
        showInfo(tr('搜索资料','Search materials'),tr('这里会搜索你保存的正文与出处。','Search the text and sources you have saved.'),'<div class="native-search-empty">'+icon('search')+'<h3>'+tr('先保存一份内容，就能在这里找回','Save something first, then find it here')+'</h3><p>'+tr('记下一条想法，或导入手头的文件。保存后可按关键词搜索。','Write a thought or import a file. You can search its text after saving.')+'</p><div class="actions section">'+route(tr('写下第一条记录','Write my first note'),'notes','btn primary')+route(tr('导入已有文件','Import a file'),'import','btn')+'</div></div>');return true;
      }
      if(state.page!=='library')go('library');
      document.getElementById('material-search')?.focus();return true;
    }
    if(name==='native-back'){
      if(state.modal){state.modal='';render();return true;}
      const fallback=state.page.startsWith('setup/')?'sources':state.page.startsWith('material/')?(state.materialReturn||'library'):primaryPage();
      const dest=native.routes.pop()||fallback||'library';native.popping=true;go(dest);return true;
    }
    return false;
  };
  document.addEventListener('keydown',e=>{
    if(!isMac()||state.modal)return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();window.platformAction('native-search');}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();go('notes');}
    if(e.key==='Escape'&&native.menuOpen){native.menuOpen=false;render();}
  });
  for(const type of ['input','change'])document.addEventListener(type,e=>{if(['source-relation','source-context-description'].includes(e.target.id)){const panel=e.target.closest('[data-source-context-id]');if(panel)refreshRelationshipSummary(panel);}});
  document.addEventListener('input',e=>{if((isAndroid()||isMac())&&['folder-path','source-name'].includes(e.target.id))readFolderDraft();});
  document.addEventListener('change',e=>{if((isAndroid()||isMac())&&['continuous','save-mode'].includes(e.target.id))readFolderDraft();});
})();

<script data-focus-layer="true">
/* R30+: focused task surfaces. Product semantics come from the independent contract. */
(() => {
  'use strict';
  const t=(zh,en)=>state.language==='en'?en:zh;
  const act=(label,name,kind='subtle',extra='')=>button(label,'focus-'+name,extra,kind);
  const route=(label,page,kind='subtle')=>goButton(label,page,kind);
  const native=()=>state.surface!=='web';
  const defaults=()=>({files:[],name:'',instruction:'',parser:'default',image:'default',save:'archive'});
  const parserOptions=[['default','默认格式处理或模型解析','Default format or model parsing'],['markdown@1.0.0','文档与笔记 · 1.0.0','Documents and notes · 1.0.0'],['chat@1.0.0','聊天导出 · 1.0.0','Chat export · 1.0.0'],['audio@1.0.0','音频与转写 · 1.0.0','Audio and transcription · 1.0.0']];
  const phaseLabels={queued:['原件已归档','Originals archived'],preparing:['正在理解资料','Preparing preview'],review:['等待你确认','Awaiting your confirmation'],importing:['正在保存记录','Saving records'],done:['记录已保存','Records saved'],failed:['需要重试','Retry needed'],cancelled:['已取消处理','Processing cancelled'],needs_configuration:['等待配置模型','Model configuration needed'],unsupported:['原件已保留 · 格式待处理','Originals retained · format unsupported'],paused:['上传已暂停','Upload paused'],uploading:['正在上传','Uploading'],throttled:['等待上传名额','Waiting for upload capacity'],stopping:['正在停止','Stopping']};
  const sampleFiles=[{name:'读书笔记.md',path:'读书笔记.md',bytes:2400,outcome:'parsed'},{name:'会议记录.txt',path:'项目/会议记录.txt',bytes:3600,outcome:'parsed'},{name:'访谈录音.wav',path:'录音/访谈录音.wav',bytes:43000,outcome:'processing'},{name:'资料归档.zip',path:'资料归档.zip',bytes:18400,outcome:'container',children:['归档/研究方法.md','归档/阅读记录.md']}];
  function init(){
    state.focus=state.focus||{};
    const f=state.focus;
    f.importDraft=f.importDraft||defaults();f.importEdits=f.importEdits||{};
    f.details=f.details||{};f.sourceVersions=f.sourceVersions||{};f.sourceConflicts=f.sourceConflicts||{};f.attributionDrafts=f.attributionDrafts||{};
    state.importOrigin='电脑文件';
    // No central-local collector fixture can survive the superseded prototype.
    state.sources=state.sources.filter(s=>s.deviceId!=='workspace'&&state.sourceConfigs?.[s.id]?.location!=='workspace');
  }
  function select(label,id,options,value,help=''){
    return '<label class="field"><span>'+label+'</span><select id="'+id+'" class="field-input">'+options.map(([v,zh,en])=>'<option value="'+v+'" '+(v===value?'selected':'')+'>'+esc(t(zh,en||zh))+'</option>').join('')+'</select>'+(help?'<small>'+help+'</small>':'')+'</label>';
  }
  function disclosure(id,title,body,extra='',open=false){
    return '<details class="focus-disclosure" id="'+id+'" '+(open?'open':'')+'><summary><span>'+title+'</span>'+(extra?'<small>'+extra+'</small>':'')+'</summary><div class="focus-disclosure-body">'+body+'</div></details>';
  }
  function phase(job){const row=phaseLabels[job.phase]||phaseLabels.queued;return t(row[0],row[1]);}
  function filesOf(job){return job.files||[{name:job.sourceFile||job.name,path:job.sourceFile||job.name,bytes:2400}];}
  const outcomes={parsed:['已解析','Parsed'],processing:['处理中','Processing'],attachment:['作为附件保留','Retained as attachment'],container:['归档容器','Archive container'],excluded:['已排除','Excluded'],unsupported:['格式未支持','Unsupported format']};
  function outcomeOf(file,job){
    if(job.phase==='unsupported')return 'unsupported';
    if(job.imageScheme==='archive'&&/\.(png|jpe?g|webp)$/i.test(file.name))return 'attachment';
    return file.outcome||(/\.(zip)$/i.test(file.name)?'container':/\.(wav|mp3|m4a)$/i.test(file.name)?'processing':'parsed');
  }
  function recordCount(job){return filesOf(job).reduce((n,f)=>n+(outcomeOf(f,job)==='parsed'?1:outcomeOf(f,job)==='container'?(f.children?.length||0):0),0);}
  function dirtyExplanation(job){return state.focus.importEdits[job.id]!=null&&state.focus.importEdits[job.id]!== (job.instruction??job.context??'');}
  function confirmationGate(){
    const job=state.imports.find(x=>x.id===state.page.split('/')[2]);if(!job)return;
    const button=document.querySelector('[data-action="focus-confirm-import"]');if(!button)return;
    const dirty=dirtyExplanation(job);button.disabled=dirty;
    const old=document.getElementById('focus-preview-stale');
    if(dirty&&!old)button.closest('.focus-submit').insertAdjacentHTML('beforebegin','<p class="notice warn" role="status" id="focus-preview-stale">'+t('说明已修改，请先重新生成预览，再确认保存。','The explanation changed. Regenerate the preview before confirming.')+'</p>');
    if(!dirty&&old)old.remove();
    if(dirty)button.setAttribute('aria-describedby','focus-preview-stale');else button.removeAttribute('aria-describedby');
  }
  function parserLabel(id){const row=parserOptions.find(x=>x[0]===id);return row?t(row[1],row[2]):id||t('默认格式处理或模型解析','Default format or model parsing');}
  function imageLabel(id){return id==='archive'?t('仅保存原件','Archive originals only'):id==='local-ocr'?t('本机 OCR · 示例方案','Local OCR · sample profile'):t('跟随默认设置','Follow default');}
  function instructionField(id,value){
    return '<label class="field focus-context"><span>'+t('格式、作者与归属说明','Format, authors and ownership')+' <em>'+t('选填','Optional')+'</em></span><textarea id="'+id+'" class="field-input" rows="4" maxlength="12000" placeholder="'+t('例如：这是我的读书笔记；引文属于原作者。时间为北京时间，按每篇笔记分别理解。','For example: these are my reading notes; quotations belong to their authors. Times are Beijing time. Treat each note separately.')+'" data-user-content>'+esc(value)+'</textarea><small>'+t('帮助 Agent 理解资料的格式、时间、作者和背景。第三方与 AI 引文保留原角色。','Help the Agent understand format, dates, authors and background. Third-party and AI quotations keep their original roles.')+'</small><small class="focus-character-count">'+value.length+' / 12,000</small></label>';
  }
  function fileList(files,editable=false){
    return '<ul class="focus-file-list">'+files.map((f,i)=>'<li><span>'+icon('file')+'<span data-user-content><strong>'+esc(f.name)+'</strong><small>'+esc(f.path)+' · '+Number(f.bytes||0).toLocaleString()+' B</small></span></span>'+(editable?act(t('移除','Remove'),'remove-file','text','data-index="'+i+'" aria-label="'+t('移除 ','Remove ')+esc(f.name)+'"'):'')+'</li>').join('')+'</ul>';
  }
  function importForm(){
    const d=state.focus.importDraft,chosen=d.files.length>0;
    return heading(t('导入资料','Import materials'),t('保存这次选定的文件，让以后查找和提问有据可依。','Save the files you choose so you can find and ask about them later.'),route(t('导入记录','Import history'),'imports','text'))+
    '<section class="focus-task reading" aria-label="'+t('导入设置','Import settings')+'"><section class="focus-zone"><div class="focus-zone-title"><span class="focus-step">1</span><h2>'+t('选择资料','Choose materials')+'</h2></div>'+
    (chosen?fileList(d.files,true)+'<div class="actions">'+act(t('继续添加文件','Add more files'),'choose-files','text')+act(t('清空选择','Clear selection'),'clear-files','text')+'</div>':'<div class="focus-upload" id="focus-dropzone"><span>'+icon('upload')+'</span><p>'+t('文档、图片、音频、ZIP 或文件夹','Documents, images, audio, ZIP or folders')+'</p>'+act(t('选择文件','Choose files'),'choose-files','primary')+'<small>'+t('也可以拖放文件；本次导入不跟踪后续变化。','You can also drop files here. This import does not track later changes.')+'</small></div>')+
    (state.focus.importError?'<p class="form-error" role="alert">'+esc(state.focus.importError)+'</p>':'')+'</section>'+
    '<section class="focus-zone"><div class="focus-zone-title"><span class="focus-step">2</span><h2>'+t('补充理解资料所需的信息','Add context for understanding')+'</h2></div>'+instructionField('focus-import-instruction',d.instruction)+'</section>'+
    disclosure('focus-import-options',t('名称、解析与图片处理','Name, parsing and image processing'),field(t('资料名称（选填）','Material name (optional)'),'focus-import-name',d.name)+
      select(t('解析方式','Format parser'),'focus-import-parser',parserOptions,d.parser,t('解析方式负责格式处理；上面的说明负责资料背景与归属。','The parser handles the format; the explanation above describes background and ownership.'))+
      select(t('本次图片处理','Images in this import'),'focus-import-image',[['default','跟随默认设置','Follow default'],['archive','仅保存原件','Archive originals only'],['local-ocr','本机 OCR · 示例方案','Local OCR · sample profile']],d.image)+
      '<p class="small muted">'+t('原件先归档。仅保存原件不会标记为已完成识别。','Originals are archived first. Archive-only does not mean recognition is complete.')+'</p>',parserLabel(d.parser)+' · '+imageLabel(d.image))+
    '<div class="focus-submit">'+act(t('上传并查看预览','Upload and preview'),'submit-import','primary',chosen?'':'disabled')+route(t('稍后继续','Continue later'),'imports','text')+'</div></section>'+
    '<p class="focus-task-foot">'+t('想持续收集文件夹变化？','Want to keep later folder changes?')+' '+route(t('到采集端设置','Set up on a collector'),'setup/folder/new','text')+'</p>';
  }
  function importInstructions(job,editable=false){
    const saved=job.instruction??job.context??'';
    return '<section class="focus-saved-context"><h3>'+t('本次导入说明','Explanation for this import')+'</h3><p class="focus-pre" data-user-content>'+esc(saved||t('未填写。原件仍会保留，已提取的正文可以检索。','No explanation supplied. Originals are retained and extracted text can be searched.'))+'</p><p class="small muted">'+t('说明只在声明的范围内生效，第三方和 AI 引文不会整批归为你的表达。','The explanation applies within its stated scope; third-party and AI quotations are not relabelled as your own speech.')+'</p></section>'+
    (editable?disclosure('focus-revise-'+job.id,t('补充说明，重新理解资料','Revise context and regenerate preview'),instructionField('focus-revised-instruction',state.focus.importEdits[job.id]??saved)+'<div class="actions">'+act(t('重新生成预览','Regenerate preview'),'reprepare-import','primary','data-id="'+job.id+'"')+act(t('放弃本次说明修改','Discard explanation changes'),'discard-import-explanation','text','data-id="'+job.id+'"')+'</div>',''):'' );
  }
  function importReview(job){
    return heading(t('核对资料的理解方式','Review the interpretation'),job.name,route(t('返回导入记录','Back to import history'),'imports','text'))+
    '<article class="reading focus-task" data-import-detail="'+job.id+'"><p class="focus-status">'+tag(t('原件已归档','Originals archived'),'green')+'<span>'+t('记录尚未保存','Records are not published yet')+'</span></p>'+
    '<section class="focus-zone"><h2>'+t('这次将保存什么','What will be saved')+'</h2><p>'+t('需要确认：示例资料含有引用与多位说话人，请核对范围后再保存。','Review needed: the sample contains quotations and several speakers. Check the scope before saving.')+'</p>'+
    '<div class="focus-preview"><span class="eyebrow">'+t('解析预览 · 演示内容','PREVIEW · SYNTHETIC CONTENT')+'</span><h3 data-user-content>'+esc(job.name)+'</h3><div class="focus-speaker-preview" aria-label="'+t('引用角色预览','Quotation role preview')+'"><p><span>'+t('我','Me')+'</span>'+t('先核对资料来源，再继续整理。','Check the sources before organizing the material.')+'</p><p><span>'+t('供应商 · 引用','Vendor · quotation')+'</span>'+t('“我们建议下周交付。”','“We suggest delivery next week.”')+'</p><p><span>AI · '+t('引用','quotation')+'</span>'+t('“可以先列出待核对的问题。”','“You could list questions to verify first.”')+'</p></div><p class="small muted">'+t('来源限定观察：这份资料记录了交付建议；供应商和 AI 的话不记作你的承诺。固定合成预览，不执行真实模型解析。','Source-scoped observation: this material records a delivery suggestion; vendor and AI speech are not your commitments. Fixed synthetic preview, with no live model parsing.')+'</p></div>'+
    '<p class="small">'+t('预计可读记录：','Expected readable records: ')+recordCount(job)+t(' · 其他文件的处理状态逐项保留 · 请核对引用归属',' · Other file outcomes are retained individually · review quotation ownership')+'</p></section>'+
    '<section class="focus-zone">'+importInstructions(job,true)+'</section>'+
    disclosure('focus-review-options',t('核对文件与处理方式','Review files and processing'),fileList(filesOf(job))+'<dl class="focus-dl"><div><dt>'+t('解析方式','Parser')+'</dt><dd>'+esc(parserLabel(job.parser))+'</dd></div><div><dt>'+t('图片处理','Images')+'</dt><dd>'+esc(imageLabel(job.imageScheme))+'</dd></div></dl>'+act(t('修改文件或选项','Edit files or options'),'edit-import','text','data-id="'+job.id+'"'))+
    (job.confirmError?'<p role="alert" class="form-error">'+esc(job.confirmError)+'</p>':'')+
    (dirtyExplanation(job)?'<p class="notice warn" role="status" id="focus-preview-stale">'+t('说明已修改，请先重新生成预览，再确认保存。','The explanation changed. Regenerate the preview before confirming.')+'</p>':'')+
    '<div class="focus-submit">'+act(t('确认并保存记录','Confirm and save records'),'confirm-import','primary','data-id="'+job.id+'" '+(dirtyExplanation(job)?'disabled aria-describedby="focus-preview-stale"':''))+route(t('稍后确认','Review later'),'imports','text')+'</div></article>';
  }
  function importDetail(job){
    const active=['queued','preparing','importing','uploading','throttled','stopping'].includes(job.phase);
    const canRevise=['review','failed','unsupported','needs_configuration','cancelled'].includes(job.phase);
    const files=filesOf(job);
    let next='';
    if(job.phase==='done')next=job.materialId?route(t('阅读导入结果','Read imported material'),'material/'+job.materialId,'primary'):'<p>'+t('原件已保留，暂无可读记录。请查看每个文件的处理原因。','Originals retained; no readable record yet. Inspect each file’s processing reason.')+'</p>';
    else if(job.phase==='review')next=route(t('核对并继续','Review and continue'),'import/review/'+job.id,'primary');
    else if(job.phase==='needs_configuration')next=act(t('配置模型后继续','Configure a model to continue'),'import-model','primary','data-id="'+job.id+'"');
    else if(['failed','cancelled','unsupported','paused'].includes(job.phase))next=act(t('继续这次导入','Continue this import'),'reprepare-import','primary','data-id="'+job.id+'"');
    else if(job.phase==='stopping')next='<p role="status">'+t('正在停止，等当前步骤结束后可以重试。','Stopping. Retry becomes available after the current step ends.')+'</p>';
    else next=act(t('查看解析预览（模拟完成）','View parsing preview (simulate completion)'),'reprepare-import','primary','data-id="'+job.id+'"');
    return heading(t('导入详情','Import detail'),job.name,route(t('返回导入记录','Back to import history'),'imports','text'))+
    '<article class="reading focus-task" data-import-detail="'+job.id+'"><section class="focus-zone"><div class="section-head"><h2>'+phase(job)+'</h2><span class="small muted">'+files.length+t(' 个文件',' files')+'</span></div>'+
    '<ol class="focus-progress"><li class="complete">'+t('原件已归档','Originals archived')+'</li><li class="'+(['review','done'].includes(job.phase)?'complete':'')+'">'+t('理解与核对','Interpret and review')+'</li><li class="'+(job.phase==='done'?'complete':'')+'">'+t('记录可阅读','Records readable')+'</li><li>'+t('记忆单独整理','Memory processed separately')+'</li></ol>'+
    '<p class="small muted">'+(job.phase==='done'?t('原件和正文已保留；索引和记忆的进度单独显示。','Originals and readable text are retained; indexing and memory have separate progress.'):t('原件保留在这次任务中，离开页面可以稍后继续。','Originals stay attached to this task. You can leave and continue later.'))+'</p>'+
    '<div class="actions section">'+next+(active&&job.phase!=='stopping'?act(t('取消处理','Cancel processing'),'cancel-import','text','data-id="'+job.id+'"'):'')+'</div></section>'+
    '<section class="focus-zone">'+importInstructions(job,canRevise)+'</section>'+

  function validateProvider(d,p){
    if(!d.name?.trim()||!d.model?.trim())return t('填写预设名称和模型 ID。','Enter a preset name and model ID.');
    let url;try{url=new URL(d.url);}catch{return t('填写有效的 Base URL。','Enter a valid Base URL.');}
    if(!['https:','http:'].includes(url.protocol))return t('地址需使用 HTTP 或 HTTPS。','Use HTTP or HTTPS.');
    if(d.local&&!['localhost','127.0.0.1','[::1]'].includes(url.hostname))return t('无认证例外仅适用于 loopback 本机服务。','Unauthenticated access is only for loopback services.');
    if(d.url!==p.url&&(p.keyPresent||p.headersPresent)&&d.keyMode==='keep'&&!d.reuse)return t('目的地址已改变。确认复用凭据，或替换/清除已有凭据后再保存。','The destination changed. Confirm credential reuse or replace/clear credentials before saving.');
    for(const [mode,key] of [['headerMode','headers'],['paramMode','params']])if(d[mode]==='replace'){try{const v=JSON.parse(d[key]);if(!v||typeof v!=='object'||Array.isArray(v))throw Error();}catch{return t('请求头和高级参数必须是 JSON 对象；草稿已保留。','Headers and advanced parameters must be JSON objects; your draft is retained.');}}
    if(d.keyMode==='replace'&&!d.key)return t('替换凭据时请填写新的示例 Key。','Enter a new demo key when replacing credentials.');
    if([d.requestTimeout,d.totalTimeout,d.output].some(v=>!Number.isFinite(Number(v))||Number(v)<=0))return t('超时与输出预算必须大于零。','Timeouts and output budget must be positive.');
    return '';
  }

      const v=p.parameters||{},numbers=['speakerCount','speakerMin','speakerMax'].filter(k=>v[k]!==''&&v[k]!=null);
      if(numbers.some(k=>!Number.isInteger(Number(v[k]))||Number(v[k])<1||Number(v[k])>16))return tr('说话人数需为 1–16 的整数，未知时留空。','Speaker counts must be integers from 1–16; leave them blank when unknown.');
      if(v.speakerCount&&(v.speakerMin||v.speakerMax)||v.speakerMin&&v.speakerMax&&Number(v.speakerMin)>Number(v.speakerMax))return tr('准确人数与范围不可同时填写，且下限不能超过上限。','Use an exact speaker count or a range; the minimum cannot exceed the maximum.');

      if(d.secretMode==='replace'&&!d.secret)return msg(t('替换密钥时需要填写新密钥。','A replacement secret is required.'),true);
      const newKey=x.kind+':'+d.id;if(newKey!==x.key&&x.c.connections[newKey])return msg(t('该连接 ID 已存在，请使用独立 ID。','That connection ID exists; choose a distinct ID.'),true);
      const saved={...clone(d),hasSecret:d.secretMode==='replace'?true:d.secretMode==='clear'?false:v.hasSecret,secret:'',secretMode:'keep',saved:true,auth:v.auth==='connected'?'connected':'ready'};
      x.c.connections[newKey]=saved;x.c.drafts[newKey]=clone(saved);x.c.active[x.kind]=saved.id;if(newKey!==x.key){delete x.c.drafts[x.key];delete x.c.connections[x.key];}persist();go('setup/'+x.kind+'/'+saved.id);return msg(t('这条连接已保存，接下来完成授权。','Connection saved. Complete authorization next.'));

    if(a==='refresh-auth'||a==='environment')return msg(t('已刷新当前回执；原型没有检查真实账号或部署环境。','Current receipt refreshed; the prototype did not check a real account or deployment.'));
    if(a==='save-context'){v.context=d.context;v.contextVersion++;register(x);save(x);return msg(t('中央已确认录音资料说明，版本 ','Recording context acknowledged, version ')+v.contextVersion);}
    if(a==='list-calendars'){if(v.auth!=='connected')return msg(t('先完成授权。','Authorize first.'),true);v.calendarsListed=true;save(x);return render();}
    if(a==='save-calendars'){if(!d.selection.length)return msg(t('至少选择一个可读日历。','Choose at least one readable calendar.'),true);if(d.selection.includes('unavailable'))return msg(t('取消不可用的旧日历，再保存其他选择。','Deselect the unavailable calendar, then save the rest.'),true);scopeSave(x);return msg(t('只读日历范围已保存，尚未执行同步。','Read-only calendar scope saved; sync has not run.'));}
    if(a==='sync-calendars'){if(v.auth!=='connected'||!v.selection.length)return msg(t('先授权并保存日历范围。','Authorize and save calendar scope first.'),true);v.results=v.selection.map(id=>({title:id,status:t('只读归档 · 没有写入日历','Read-only archive · no calendar write'),materialId:addMaterial(x,'calendar-'+id,id+' · 示例日程','只读归档。全天日期按 '+v.timezone+' 解释。未向日历写入。')}));x.c.tabs[x.key]='results';v.checkpoint='calendars-page-1';save(x);return render();}
    if(a==='save-docs'){['lookback','activityOpened','activityEdited','activityCreated','documents','folders','wiki','exclusions'].forEach(k=>v[k]=d[k]);save(x);return msg(t('发现范围已保存；活动发现与明确跟踪分别生效，排除项优先。','Discovery scope saved. Activity discovery and explicit tracking differ; exclusions take precedence.'));}
    if(a==='preview-docs'){v.discovery=[{id:'doc-1',title:'项目背景',excluded:v.exclusions.split(/\s+/).includes('doc-1')},{id:'doc-2',title:'交付建议',excluded:v.exclusions.split(/\s+/).includes('doc-2')}];save(x);return msg(t('已列出候选标题，尚未读取正文或归档。','Candidate titles listed. Body has not been read or archived.'));}
    if(a==='archive-docs'){if(!v.discovery)return msg(t('先预览发现结果。','Preview discovery first.'),true);v.results=v.discovery.filter(q=>!q.excluded).map(q=>q.id==='doc-2'?{title:q.title,status:t('读取失败 · 可单独重试','Read failed · retry separately'),failed:true,stage:'document',documentId:q.id}:{title:q.title,status:t('正文已归档','Body archived'),materialId:addMaterial(x,q.id,q.title,'合成文档正文。打开活动不表示用户认同内容。')});v.counts.failed=v.results.filter(q=>q.failed).length;x.c.tabs[x.key]='results';save(x);return render();}
    if(a==='sync-mail')return syncMail(x);
    if(a==='start-recordings'){if(d.start&&d.end&&d.start>d.end)return msg(t('结束日期不能早于开始日期。','End date must not precede start.'),true);scopeSave(x);return syncRecording(x);}
    if(a==='retry-step'){const r=v.results[Number(el.dataset.index)];if(!r)return;if(r.stage==='audio')return syncRecording(x,true);r.materialId=addMaterial(x,r.documentId,r.title,'重试后保存的合成文档正文。');r.failed=false;r.status=t('单独重试成功，其他已归档资料保持不变','Individual retry succeeded; other archived material retained');v.counts.failed=v.results.filter(q=>q.failed).length;save(x);return render();}
    if(a==='history'){if(x.kind==='gmail')return syncMail(x,true);v.moreHistory=false;v.checkpoint='recordings-page-2';v.counts.pending=0;save(x);return msg(t('已继续到下一检查点；这一页没有新增文稿。','Advanced to the next checkpoint; this page has no new transcripts.'));}
    if(a==='enable'){if(v.auth!=='connected')return msg(t('先完成授权。','Authorize first.'),true);if(x.kind==='recordings'&&(!v.contextVersion||d.context!==v.context))return msg(t('先保存并确认录音资料说明。','Save and acknowledge recording context first.'),true);if(x.kind==='google'&&!v.selection.length)return msg(t('先保存日历范围。','Save calendar scope first.'),true);scopeSave(x);v.enabled=true;register(x);save(x);return msg(t('已按保存的范围启用后续接收。','Future intake enabled for the saved scope.'));}
    if(['pause','stop','disconnect'].includes(a)){v.enabled=false;if(a==='disconnect')v.auth='ready';register(x);save(x);return msg(t('后续接收已停止。既有归档和资料说明保留。','Future intake stopped. Existing archive and context retained.'));}
    if(a==='remove'){x.c.message[x.key]={text:t('移除连接会停止后续接收，历史归档保留。请再次确认。','Removing this connection stops future intake and retains the archive. Confirm again.'),error:true};x.c.removePending=x.key;persist();render();document.querySelector('.cn-status').insertAdjacentHTML('afterend','<div class="notice warn">'+B(t('确认移除连接','Confirm connection removal'),'confirm-remove','danger')+B(t('保留连接','Keep connection'),'cancel-remove','text')+'</div>');return;}
    if(a==='cancel-remove'){delete x.c.removePending;return render();}
    if(a==='confirm-remove'){if(x.c.removePending!==x.key)return;const id=sourceId(x);state.sources=state.sources.filter(s=>s.id!==id);delete x.c.connections[x.key];delete x.c.drafts[x.key];delete x.c.removePending;persist();return go('sources');}
    if(a==='cancel-operation'){v.phase='cancelled';save(x);return msg(t('当前操作已取消，成功归档的资料与检查点保留。','Current operation cancelled; successful archives and checkpoints retained.'));}
    if(a==='refresh')return msg(t('当前连接的结果与检查点已刷新。','Results and checkpoint refreshed for this connection.'));
    if(['empty','unsupported','unknown','retry-exhausted'].includes(a)){v.phase=a;v.submissionId||='submission-'+v.id;const labels={empty:['厂商文稿为空 · 不伪造正文','Vendor transcript empty · no fabricated body'],unsupported:['厂商格式暂不支持 · 原记录保留','Vendor format unsupported · source record retained'],unknown:['提交结果未知 · '+v.submissionId,'Submission unknown · '+v.submissionId],'retry-exhausted':['自动重试已耗尽 · 请手动重试失败步骤','Automatic retries exhausted · retry the failed step manually']};v.results.push({title:t('本次状态','Current state'),status:t(...labels[a]),failed:a==='retry-exhausted',stage:'audio'});save(x);return render();}
    if(a==='retry-unknown'){v.phase='complete';save(x);return msg(t('同一提交已确认，没有新建重复批次：','Same submission confirmed without duplicating the batch: ')+v.submissionId);}
    if(a==='save-reference'){if(!d.title.trim()||!d.url.trim())return msg(t('填写名称与文件位置。','Enter a title and location.'),true);Object.assign(v,{title:d.title,url:d.url,observed:new Date().toISOString(),saved:true});register(x);save(x);return msg(t('外部引用已保存；未读取远程正文。','External reference saved; remote body not read.'));}
    if(a==='mcp-demo'){d.url='https://resources.example.invalid/mcp';d.title=t('示例资料服务','Example resource service');persist();return render();}
    if(a==='mcp-list'){if(!/^https?:\/\//.test(d.url))return msg(t('填写 http / https 服务 URL。','Enter an HTTP or HTTPS service URL.'),true);Object.assign(v,{title:d.title,url:d.url,listed:true,resources:d.fixture==='empty'?[]:[{id:'r1',title:'研究笔记',uri:'notes://research/one'},{id:'r2',title:'项目资料',uri:'notes://project/two'}]});save(x);return render();}
    if(a==='mcp-import'){if(!d.selection.length)return msg(t('选择至少一份可读资料。','Select at least one readable resource.'),true);v.saved=true;register(x);d.selection.forEach(id=>{const r=v.resources.find(r=>r.id===id);if(r)addMaterial(x,id,r.title,'合成 MCP 资料正文。资源 URI：'+r.uri);});save(x);return msg(t('所选资料已一次导入，逐项保留原资源 URI。','Selected resources imported once, retaining their original URIs.'));}
  },true);
})();

</script>
<script data-iteration-start="true">
document.documentElement.dataset.round=String(window.MOTE_ROUND);
document.documentElement.dataset.surface=window.MOTE_SURFACE;
if(typeof window.initializeMoteIteration==='function') window.initializeMoteIteration();
else {render();if(typeof window.enhancePlatformUI==='function')window.enhancePlatformUI();}
</script>
