nt":[{"id":"material-brief","title":"松林项目 · 需求说明","type":"document","typeLabel":"文档","sourceId":"source-folder","sourceLabel":"项目文件夹","capturedAt":"2026-10-20T09:20:00+08:00","status":"ready","summary":"首次使用要能理解产品用途；文件夹同步、文件导入和屏幕记录需要同样容易找到。","body":"松林项目关注个人资料的汇集与找回。首次打开时，应说明能保存哪些内容，以及之后怎样检索、提问和回顾。\n\n这次评审优先处理三件事：让文件夹同步和文件导入与屏幕记录同样可见；展示答案对应的原文；保留编辑中的草稿。\n\n完整功能通过分类目录查找。低频设置继续留在各自分组中。","tags":["松林","需求","首屏"],"originalName":"松林项目需求说明.md","version":"3","originalAvailable":true},{"id":"material-note","title":"第一次使用时，我会问的三个问题","type":"note","typeLabel":"随手记","sourceId":"source-notes","sourceLabel":"随手记","capturedAt":"2026-10-20T10:05:00+08:00","status":"ready","summary":"这是什么？我能放进什么？保存之后在哪里找？","body":"第一次打开，我想先知道：\n1. 这个产品帮我做什么？\n2. 文件、文件夹和屏幕记录分别怎样加入？\n3. 之后怎样找回内容并核对出处？\n\n主操作应该清楚，更多功能可以逐步展开。","tags":["松林","想法"],"originalName":"第一次使用的三个问题.txt","version":"1","originalAvailable":true,"attachmentIds":["material-whiteboard"]},{"id":"material-meeting","title":"松林评审会 · 重点与下一步","type":"transcript","typeLabel":"录音转写","sourceId":"source-feishu-recordings","sourceLabel":"飞书妙记","capturedAt":"2026-10-19T15:30:00+08:00","status":"ready","summary":"讨论文件夹同步入口、默认资料库说明以及引用回到原文的体验。","body":"林澈：先让用户知道资料保存在同一处，然后能带着问题回来找。\n周桐：导入文件是一次添加，同步文件夹会持续跟踪变化，这两种方式要讲清楚。\n林澈：回答里要能打开原文，而不是只有一个来源名字。\n周桐：本周先验证默认页理解，再看需要哪些细节。","tags":["松林","评审","会议"],"durationLabel":"24 分钟","originalName":"松林评审会.m4a","version":"1","originalAvailable":true},{"id":"material-coding","title":"修复资料详情返回后的列表位置","type":"coding","typeLabel":"Coding 会话","sourceId":"source-coding","sourceLabel":"Codex 会话","capturedAt":"2026-10-19T18:40:00+08:00","status":"ready","summary":"打开资料详情后返回，恢复之前的筛选条件和列表位置。","body":"问题：从列表打开详情后返回，筛选和滚动位置被清空。\n\n处理：将当前来源、类型筛选和滚动位置保留在列表状态中。详情关闭时恢复原位置。\n\n检查：分别从全部资料和某来源的筛选结果打开同一条记录，返回后仍在原列表上下文。","tags":["松林","开发","返回"],"originalName":"coding-session-demo.json","version":"1","originalAvailable":true},{"id":"material-screen","title":"资料库筛选 · 页面记录","type":"screen","typeLabel":"屏幕记录","sourceId":"source-mac","source function translateUI(text,depth=0){
 const raw=String(text??''),key=raw.trim();
 if(!key||depth>3)return raw;
 if(Object.hasOwn(englishLabels,key))return raw.replace(key,englishLabels[key]);
 let m;
  if((m=key.match(/^(\d+) 组 · (\d+) 条片段$/)))return m[1]+' group'+(m[1]==='1'?'':'s')+' · '+m[2]+' snippet'+(m[2]==='1'?'':'s');
  if((m=key.match(/^连续会话 (\d+)$/)))return 'Continuous session '+m[1];
  if((m=key.match(/^(\d+) 条片段$/)))return m[1]+' snippet'+(m[1]==='1'?'':'s');
 if((m=key.match(/^删除“(.+)”这次导入及其生成的 (\d+) 份资料。外部原件与其他导入保留。$/)))return 'Delete the import “'+m[1]+'” and the '+m[2]+' material'+(m[2]==='1'?'':'s')+' it created. External originals and other imports are retained.';
 if((m=key.match(/^已保存：(.+) · ([A-Z]{3}) · 输入 (.+) \/ 输出 (.+) \/ 缓存 (.+)$/)))return 'Saved: '+m[1]+' · '+m[2]+' · Input '+m[3]+' / Output '+m[4]+' / Cache '+m[5];
 if((m=key.match(/^先预览和验证，再单独应用。当前仍运行 (.+)。$/)))return 'Preview and validate first, then apply separately. The active scheme is still '+translateUI(m[1],depth+1)+'.';
 if((m=key.match(/^仅允许读取 (.+)$/)))return 'Read-only access to '+translateUI(m[1],depth+1);
 if((m=key.match(/^待发送 (\d+) 项$/)))return m[1]+' items waiting to send';
 if((m=key.match(/^版本：示例 (.+) · 当前绑定：(.+)$/)))return 'Version: Example '+m[1]+' · Active binding: '+translateUI(m[2],depth+1);
 const enumPrefixes={'目标：':'Target: ','历史范围：':'Historical scope: ','状态：':'Status: ','实例：':'Instance: '};
 for(const [prefix,label] of Object.entries(enumPrefixes))if(key.startsWith(prefix))return label+translateUI(key.slice(prefix.length),depth+1);
 const dataPrefixes={'请求 ':'Request ','示例凭据：':'Example credential: ','日期：':'Date: '};
 for(const [prefix,label] of Object.entries(dataPrefixes))if(key.startsWith(prefix))return label+key.slice(prefix.length);

 if((m=key.match(/^(\d+) 条$/)))return m[1]+' item'+(m[1]==='1'?'':'s');
 if((m=key.match(/^文件 \/ (.+)$/)))return 'File / '+m[1];
 if((m=key.match(/^会话 (.+)$/)))return 'Session '+m[1];
 if((m=key.match(/^打开(.+)$/))&&Object.hasOwn(englishLabels,m[1]))return 'Open '+englishLabels[m[1]];
 if((m=key.match(/^(\d+) 项功能 · 按任务分组$/)))return m[1]+' features · Organized by task';
 if((m=key.match(/^找到 (\d+) 项功能$/)))return m[1]+' matching features';
 if((m=key.match(/^(\d+) 份已保存资料$/)))return m[1]+' saved material'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 个应用$/)))return m[1]+' app'+(m[1]==='1'?'':'s');
 if((m=key.match(/^已保存 (\d+) 个应用：(.+)$/)))return m[1]+' saved apps: '+translateUI(m[2],depth+1);
 if((m=key.match(/^(浏览器|编辑器|即时通讯)(、(?:浏览器|编辑器|即时通讯))+$/)))return key.split('、').map(x=>translateUI(x,depth+1)).join(', ');
 if((m=key.match(/^(屏幕|文件夹)：(.+)$/)))return ({屏幕:'Screen',文件夹:'Folders'})[m[1]]+': '+translateUI(m[2],depth+1);
 if((m=key.match(/^人工纠正 (\d+)$/)))return 'Manual correction '+m[1];
 if((m=key.match(/^移除(.+)$/)))return 'Remove '+m[1];
 if((m=key.match(/^(.+)的回顾$/)))return 'Review · '+translateUI(m[1],depth+1);
 if((m=key.match(/^按保存日期纳入 (\d+) 份资料$/)))return m[1]+' materials included by save date';
 if((m=key.match(/^本次使用的资料 · (\d+) 份$/)))return 'Materials used · '+m[1];
 if((m=key.match(/^(\d+) 份依据$/)))return m[1]+' source'+(m[1]==='1'?'':'s');
 if((m=key.match(/^核对 (\d+) 份原文依据$/)))return 'Check '+m[1]+' original sources';
 if((m=key.match(/^待同步笔记：(\d+) 条$/)))return 'Notes waiting to sync: '+m[1];
 if((m=key.match(/^附图 (\d+) 张$/)))return m[1]+' attached image'+(m[1]==='1'?'':'s');
 if((m=key.match(/^附图：(.+)$/)))return 'Attached images: '+m[1];
 if((m=key.match(/^到期：(.+)$/)))return 'Due: '+m[1];
 if((m=key.match(/^(\d+) 份资料$/)))return m[1]+' material'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 条记录$/)))return m[1]+' record'+(m[1]==='1'?'':'s');
 if((m=key.match(/^(\d+) 项$/)))return m[1]+' item'+(m[1]==='1'?'':'s');
 if((m=key.match(/^第 (\d+) \/ (\d+) 页$/)))return 'Page '+m[1]+' / '+m[2];
 if((m=key.match(/^(\d+(?:\.\d+)?) 秒$/)))return m[1]+' sec';
 if((m=key.match(/^(\d+)小时\s*(\d+)分$/)))return m[1]+' hr '+m[2]+' min';
 if((m=key.match(/^(\d+)分$/)))return m[1]+' min';
 if((m=key.match(/^(\d+)月(\d+)日[–—-](?:(\d+)月)?(\d+)日$/)))return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[1])-1]+' '+m[2]+'–'+(m[3]?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[3])-1]+' ':'')+m[4];
 if((m=key.match(/^(\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?) 至 (\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?)$/)))return m[1]+' to '+m[2];
 if((m=key.match(/^(\d+)月(\d+)日(.*)$/)))return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m[1])-1]+' '+m[2]+m[3];
 if((m=key.match(/^(今天|昨天)(\s+\d{1,2}:\d{2})$/)))return ({今天:'Today',昨天:'Yesterday'})[m[1]]+m[2];
 if((m=key.match(/^(资料|记忆|洞察) \/ (\d+) 项$/)))return ({资料:'Materials',记忆:'Memories',洞察:'Insights'})[m[1]]+' / '+m[2]+' items';
 if((m=key.match(/^来源连接：(\d+) 项 · 可阅读资料：(\d+) 份$/)))return 'Connected sources: '+m[1]+' · Readable materials: '+m[2];
 if((m=key.match(/^已选择 (\d+) 个应用$/)))return m[1]+' selected app'+(m[1]==='1'?'':'s');
 if((m=key.match(/^屏幕录制权限：(.+)$/)))return 'Screen recording permission: '+translateUI(m[1],depth+1);
 if((m=key.match(/^当前版本 · (.+)$/)))return 'Current version · '+translateUI(m[1],depth+1);
 if((m=key.match(/^进度 (\d+)%$/)))return 'Progress '+m[1]+'%';
 if((m=key.match(/^播放进度 (\d+)%$/)))return 'Playback progress '+m[1]+'%';
 if((m=key.match(/^待你澄清 · (\d+)$/)))return 'Needs clarification · '+m[1];
 if((m=key.match(/^按资料保存日期：(.+)$/)))return 'By material save date: '+translateUI(m[1],depth+1);
 if(key.includes(' → '))return key.split(' → ').map(x=>translateUI(x,depth+1)).join(' → ');
 if(key.includes(' · '))return key.split(' · ').map(x=>translateUI(x,depth+1)).join(' · ');
 return raw;
}
function localizeUI(){
 document.documentElement.lang=state.language==='en'?'en':'zh-CN';
 document.title=state.language==='en'?'Mote · Personal library':'Mote · 个人资料库';
 if(state.language!=='en')return;
 const root=document.getElementById('prototype');
 // Display text must never become an option's business value when language changes.
 root.querySelectorAll('option:not([value])').forEach(option=>option.setAttribute('value',option.textContent));
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
 while(node=walker.nextNode()){
  if(node.parentElement.closest(userContentSelector)||node.parentElement.matches(userTextNodeSelector))continue;
  node.textContent=translateUI(node.textContent);
 }
 root.querySelectorAll('[aria-label],[placeholder],[title]').forEach(element=>{
  if(element.closest('[data-user-content]'))return;
  for(const attr of ['aria-label','placeholder','title']){
   const text=element.getAttribute(attr);if(text)element.setAttribute(attr,translateUI(text));
  }
 });
}

}
function memoryName(kind){return kind==='original'?mcText('产品设计偏好','Product design preference'):mcText('从资料整理的记忆','Memory from materials');}
function memoryVersions(kind){
 const original=kind==='original';
 const first={text:original?originalMemorySeed:(state.generatedMemoryOriginal||state.generatedMemoryText||state.memoryContext),at:original?'2026-10-20T01:30:00.000Z':state.generatedMemoryCreatedAt||null};
 const log=state.memoryVersionLog?.[kind];
 const old=original?state.originalMemoryHistory:state.generatedMemoryHistory;
 const versions=[first,...(log||((old||[]).map(text=>({text,at:null}))))];
 return versions.map((v,i)=>({...v,index:i+1,until:versions[i+1]?.at||null,current:i===versions.length-1}));
}
function recordMemoryVersion(kind,text){

function buildQuestionContext(){
 const question=(document.getElementById('context-question')?.value||'').trim();
 const grants=state.accessGrants.filter(g=>g.active),grant=grants.find(g=>g.id===(document.getElementById('context-preview-grant')?.value||state.contextPreviewGrant))||grants[0];

 if(!grant){notify(mcText('先选择有效的只读授权。','Select an active read-only grant first.'));return;}
 state.contextPreviewGrant=grant.id;
 const chunks=question.toLowerCase().match(/[a-z0-9]{2,}|[\u3400-\u9fff]{2,}/g)||[];
 const terms=[...new Set(chunks.flatMap(x=>/[\u3400-\u9fff]/.test(x)?Array.from({length:Math.max(1,x.length-1)},(_,i)=>x.slice(i,i+2)):[x]))];
 const candidates=state.materials.map(m=>({id:m.id,title:m.title,excerpt:m.body,page:'material/'+m.id}));
 if(grant.scope.includes('记忆'))for(const kind of memoryKinds())candidates.push({id:'memory-'+kind,title:memoryName(kind),excerpt:memoryVersions(kind).at(-1).text,page:'memories'});
 if(grant.scope.includes('洞察'))for(const r of state.insightReports)candidates.push({id:r.id,title:r.question,excerpt:r.question+' · '+r.dates,page:'insights'});
 const items=candidates.map(c=>({...c,score:terms.filter(term=>(c.title+' '+c.excerpt).toLowerCase().includes(term)).length})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score).slice(0,4).map(({score,...c})=>({...c,excerpt:c.excerpt.slice(0,240)}));

}

function currentNoteRecord(){
 const id=state.noteDraftId||state.noteSaved||('note-'+Date.now()+'-'+(++state.noteSequence));

 return {id,title:state.note.trim().split('\n')[0].slice(0,36)||'带附件的笔记',type:'note',source:'随手记',date:'刚刚',preview:state.note.slice(0,80),text:state.note,attachments:[...state.attachments],body:state.note+(state.attachments.length?'\n附件：'+state.attachments.join('、'):''),device:state.surface==='web'?'网页':state.surface==='mac'?'Mac':'Android',origin:'我写的记录'};

function commitNoteRecord(note){
 const previous=state.materials.findIndex(m=>m.id===note.id);
 if(previous>=0)state.materials[previous]={...note};else state.materials.unshift({...note});
 state.noteQueue=state.noteQueue.filter(item=>item.id!==note.id);
 if(state.noteDraftId===note.id){state.noteSaved=note.id;state.noteQueued=null;state.noteDirty=false;}
}
function saveCurrentNote(){
 if(!state.note.trim()&&!state.attachments.length)return notify('先写一点内容或添加附件。');
 const note=currentNoteRecord();
 if(state.noteNetwork==='offline'){
  const item={...note,status:'pending'},index=state.noteQueue.findIndex(q=>q.id===note.id);
  if(index>=0)state.noteQueue[index]=item;else state.noteQueue.unshift(item);
  state.noteQueued=note.id;state.noteDirty=false;persist();return notify('已保存在本机待同步队列，恢复连接后可重试同步。');
 }
 commitNoteRecord(note);persist();return notify('笔记已保存到资料库。','material/'+note.id);
}

 return false;
}

window.addEventListener('resize',()=>{clearTimeout(window.moteResizeTimer);window.moteResizeTimer=setTimeout(render,120);});
window.addEventListener('hashchange',()=>{const p=decodeURIComponent(location.hash.replace(/^#\/?/,''))||'library';if(p!==state.page){state.page=p;render();}});
document.addEventListener('keydown',e=>{if(!state.authenticated&&e.key==='Enter'&&e.target.matches('#demo-username,#demo-password')){e.preventDefault();accountAction('demo-login');return;}const dialog=document.querySelector('[role=dialog]');if(e.key==='Escape'&&dialog){e.preventDefault();state.modal='';render();return;}if(e.key==='Tab'&&dialog){const options=[...dialog.querySelectorAll('button,a[href],input,textarea,select,summary,[tabindex]')].filter(el=>el.tabIndex>=0&&availableControl(el));if(options.length){e.preventDefault();const i=options.indexOf(document.activeElement),next=i<0?(e.shiftKey?options.length-1:0):(i+(e.shiftKey?-1:1)+options.length)%options.length;options[next].focus();}return;}if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...e.target.closest('[role=tablist]').querySelectorAll('[role=tab]')],index=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowLeft'?-1:1)+tabs.length)%tabs.length,id=tabs[next].dataset.tab;tabs[next].click();document.querySelector('[role=tab][data-tab="'+id+'"]')?.focus();return;}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!dialog){e.preventDefault();if(pageMain()==='notes')doAction('save-note');if(pageMain()==='ask')doAction('send-ask');}});

<script data-iteration-layer="common.js">

setupPage=function(){return state.surface==='web'&&state.page==='setup/screen'?webScreenSetup():nuBaseSetup();};
devicesPage=function(){

  ['授权已更新',nuText('设备连接授权已更新','Device connection authorization renewed')],

  ['未在记录 · 权限已拒绝',nuText('未在记录 · 系统屏幕权限被拒绝','Not recording · system screen permission denied')],
  ['向中央发送已暂停',nuText('向工作台同步已暂停','Sync to this workspace is paused')],

 ];

};
doAction=function(action,el){
 if(action==='connect-device'&&state.nuSetupReturn==='screen'){
  const target=el.dataset.device.toLowerCase();state.nuSetupReturn='';nuBaseDoAction(action,el);state.nuScreenTarget=target;persist();go('setup/screen');return;

materialRow=function(material){
 const html=nuBaseMaterialRow(material),query=(state.search||'').trim();

 const body=String(material.body||''),at=body.toLocaleLowerCase().indexOf(query.toLocaleLowerCase());
 if(at<0)return html;
 const start=Math.max(0,at-8),end=Math.min(body.length,at+query.length+85);
 const excerpt=(start?'…':'')+esc(body.slice(start,at))+'<mark>'+esc(body.slice(at,at+query.length))+'</mark>'+esc(body.slice(at+query.length,end))+(end<body.length?'…':'');
 return html.replace(/<span class="material-preview">[\s\S]*?<\/span>/,'<span class="material-preview material-match"><span class="match-label">'+nuText('正文命中','Found in the note')+'</span><span data-user-content>'+excerpt+'</span></span>');
};

 '<div class="welcome-lead"><div class="welcome-copy"><p class="welcome-eyebrow">Mote · '+nuText('个人资料与记忆库','Your personal knowledge and memory library')+'</p>'+

function enhanceCommonUI(){

 document.body.dataset.round=String(window.MOTE_ROUND||REV);
 const control=document.getElementById('preview-surface');
 if(control){control.value=state.surface;control.disabled=true;control.title=nuText('此文件为独立平台预览','This is a dedicated platform preview');}

 if(lab)lab.innerHTML='<span class="dot"></span><span>Mote · '+({web:'Web',mac:'Mac',android:'Android'})[state.surface]+' · R'+(window.MOTE_ROUND||REV)+'</span><span class="muted">'+nuText('交互原型 · 演示数据','Interactive prototype · demo data')+'</span>';

 const note=state.page==='notes'&&document.querySelector('.reading');
 if(note&&state.noteSaved&&!state.noteDirty&&state.noteNetwork==='online'){

<script data-iteration-layer="platform.js">
/* Platform presentation adapters. The original R19 actions remain the source of UI behavior. */
(() => {
  'use strict';
  const tr = (zh, en) => state.language === 'en' ? en : zh;
  const native = {menuOpen:false, routes:[], lastPage:'', popping:false};
  const isAndroid = () => state.surface === 'android';
  const isMac = () => state.surface === 'mac';
  const device = () => isAndroid() ? 'Android' : 'Mac';
  const action = (label, name, cls='', attrs='') => '<button type="button" class="'+cls+'" data-action="'+name+'" '+attrs+'>'+label+'</button>';
  const route = (label, page, cls='') => action(label,'go',cls,'data-page="'+page+'"');
  const localScreen = () => state.sources.find(s=>s.id==='screen');
  function screenState(){
    if(!localScreen())return tr('尚未开启','Not set up');
    if(state.permission!=='已授权')return tr('等待权限','Permission needed');
    if(state.sourcePaused.screen)return tr('已暂停','Paused');
    return tr('正在记录','Recording');
  }
  function folderState(){
    const rows=state.sources.filter(s=>sourceKind(s.id)==='folder');
    if(!rows.length)return tr('尚未连接','Not connected');
    const active=rows.filter(s=>!state.sourcePaused[s.id]);
    return active.length ? tr(active.length+' 个正在接收',active.length+' receiving') : tr('已暂停接收','Receiving paused');
  }
  function adaptAndroidFixtures(){
    if(!isAndroid())return false;
    let changed=false;
    for(const s of state.sources){
      if(s.id==='screen'&&s.title==='Mac 屏幕'){s.title='Android 屏幕';s.subtitle='Android · 已保存的应用范围';changed=true;}
      if(s.id==='folder'&&s.subtitle==='Mac · ~/Documents/研究资料'){s.subtitle='Android · Documents/研究资料';changed=true;}
      if(sourceKind(s.id)==='folder'&&s.subtitle.startsWith('Mac · ')){s.subtitle=s.subtitle.replace(/^Mac · /,'Android · ');changed=true;}
    }

    if(name==='native-search'){
      if(!state.materials.length){
        showInfo(tr('搜索资料','Search materials'),tr('这里会搜索你保存的正文与出处。','Search the text and sources you have saved.'),'<div class="native-search-empty">'+icon('search')+'<h3>'+tr('先保存一份内容，就能在这里找回','Save something first, then find it here')+'</h3><p>'+tr('记下一条想法，或导入手头的文件。保存后可按关键词搜索。','Write a thought or import a file. You can search its text after saving.')+'</p><div class="actions section">'+route(tr('写下第一条记录','Write my first note'),'notes','btn primary')+route(tr('导入已有文件','Import a file'),'import','btn')+'</div></div>');return true;
      }
      if(state.page!=='library')go('library');
      document.getElementById('material-search')?.focus();return true;
    }
    if(name==='native-back'){
      if(state.modal){state.modal='';render();return true;}
      const fallback=state.page.startsWith('setup/')?'sources':state.page.startsWith('material/')?(state.materialReturn||'library'):primaryPage();
      const dest=native.routes.pop()||fallback||'library';native.popping=true;go(dest);return true;
    }
    return false;
  };
  document.addEventListener('keydown',e=>{
    if(!isMac()||state.modal)return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();window.platformAction('native-search');}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();go('notes');}
    if(e.key==='Escape'&&native.menuOpen){native.menuOpen=false;render();}
  });
  document.addEventListener('input',e=>{if((isAndroid()||isMac())&&['folder-path','source-name'].includes(e.target.id))readFolderDraft();});
  document.addEventListener('change',e=>{if((isAndroid()||isMac())&&['continuous','save-mode'].includes(e.target.id))readFolderDraft();});
})();

</script>
<script data-iteration-start="true">
document.documentElement.dataset.round=String(window.MOTE_ROUND);
document.documentElement.dataset.surface=window.MOTE_SURFACE;
if(typeof window.initializeMoteIteration==='function') window.initializeMoteIteration();
else {render();if(typeof window.enhancePlatformUI==='function')window.enhancePlatformUI();}
</script>
