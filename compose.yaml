name: ${MOTE_COMPOSE_PROJECT:?Use node scripts/mote.mjs compose with a profile}
services:
  mote:
    image: ${MOTE_IMAGE:?Profile image is required}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOTE_PORT:?Profile port is required}:47832"
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated raw profile environment is required}
        format: raw
    environment:
      MOTE_ENV_FILE: /app/deploy/empty.env
      MOTE_HOST: 0.0.0.0
      MOTE_PORT: 47832
      MOTE_DATA_DIR: /data
      MOTE_LOG_DIR: /data/logs
    volumes:
      - mote-data:/data
      - mote-models:/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ocr-worker:
    image: ${MOTE_IMAGE:?Profile image is required}
    restart: unless-stopped
    network_mode: "service:mote"
    depends_on:
      mote:
        condition: service_started
    env_file:
      - path: ${MOTE_MEDIA_DOCKER_ENV_FILE:?Generated media environment is required}
        format: raw
    volumes:
      - mote-models:/models:ro
    command: ["/opt/mote-media-venv/bin/python", "scripts/ocr-server.py", "--model-root", "/models/ocr", "--port", "9010"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
  asr-worker:
    image: ${MOTE_IMAGE:?Profile image is required}
    restart: unless-stopped
    network_mode: "service:mote"
    depends_on:
      mote:
        condition: service_started
    env_file:
      - path: ${MOTE_MEDIA_DOCKER_ENV_FILE:?Generated media environment is required}
        format: raw
    volumes:
      - mote-models:/models:ro
    command: ["/opt/mote-media-venv/bin/python", "scripts/transcription-server.py", "--model", "/models/dialogue", "--segmentation-model", "/models/dialogue/segmentation.onnx", "--speaker-model", "/models/dialogue/speaker.onnx", "--port", "9009"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  mote-data:
    name: ${MOTE_VOLUME:?Profile-specific volume is required}
  mote-models:
    name: ${MOTE_MODELS_VOLUME:?Profile-specific models volume is required}
