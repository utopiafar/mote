name: ${MOTE_COMPOSE_PROJECT:?Use node scripts/mote.mjs compose with a profile}
services:
  storage-init:
    image: ${MOTE_IMAGE:?Profile image is required}
    user: "0:0"
    restart: "no"
    command: ["node", "scripts/storage-owner-entry.mjs", "${MOTE_CONTAINER_USER:?Profile owner is required}", "/data", "${MOTE_MODELS_DIRECTORY:?Configured model directory is required}"]
    volumes:
      - type: volume
        source: mote-data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: mote-models
        target: ${MOTE_MODELS_DIRECTORY:?Configured model directory is required}
        volume:
          nocopy: true
    network_mode: none
  mote:
    image: ${MOTE_IMAGE:?Profile image is required}
    build: .
    user: ${MOTE_CONTAINER_USER:?Profile owner is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOTE_PORT:?Profile port is required}:${MOTE_PORT:?Profile port is required}"
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated secret environment is required}
        format: raw
    environment:
      MOTE_CONFIG_FILE: /config/mote.yaml
    volumes:
      - type: volume
        source: mote-data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: mote-models
        target: ${MOTE_MODELS_DIRECTORY:?Configured model directory is required}
        volume:
          nocopy: true
      # Mount the parent directory so an atomic YAML replacement remains visible.
      - type: bind
        source: ${MOTE_CONFIG_DIRECTORY:?Profile configuration directory is required}
        target: /config
    depends_on:
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ocr-worker:
    image: ${MOTE_IMAGE:?Profile image is required}
    user: ${MOTE_CONTAINER_USER:?Profile owner is required}
    restart: unless-stopped
    network_mode: "service:mote"
    depends_on:
      mote:
        condition: service_healthy
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated secret environment is required}
        format: raw
    environment:
      MOTE_CONFIG_FILE: /config/mote.yaml
    volumes:
      - type: volume
        source: mote-models
        target: ${MOTE_MODELS_DIRECTORY:?Configured model directory is required}
        # The existing execution-facts store shares the model resource root and
        # must survive a sidecar restart; do not create a second receipt ledger.
        read_only: false
        volume:
          nocopy: true
      - type: bind
        source: ${MOTE_CONFIG_DIRECTORY:?Profile configuration directory is required}
        target: /config
        read_only: true
    command: ["node", "scripts/media-worker-entry.mjs", "ocr", "/opt/mote-media/ocr/bin/python"]
    healthcheck:
      test: ["CMD", "node", "scripts/media-worker-health.mjs", "ocr"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
  asr-worker:
    extends: ocr-worker
    command: ["node", "scripts/media-worker-entry.mjs", "asr", "/opt/mote-media/dialogue/bin/python"]
    healthcheck:
      test: ["CMD", "node", "scripts/media-worker-health.mjs", "asr"]
      interval: 30s
      timeout: 5s
      start_period: 30s
volumes:
  mote-data:
    name: ${MOTE_VOLUME:?Profile-specific volume is required}
  mote-models:
    name: ${MOTE_MODELS_VOLUME:?Profile-specific models volume is required}
