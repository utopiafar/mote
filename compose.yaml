name: ${MOTE_COMPOSE_PROJECT:?Use node scripts/mote.mjs compose with a profile}
services:
  mote:
    image: ${MOTE_IMAGE:?Profile image is required}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOTE_PORT:?Profile port is required}:47832"
    env_file:
      - path: ${MOTE_DOCKER_ENV_FILE:?Generated raw profile environment is required}
        format: raw
    environment:
      MOTE_ENV_FILE: /app/deploy/empty.env
      MOTE_HOST: 0.0.0.0
      MOTE_PORT: 47832
      MOTE_DATA_DIR: /data
      MOTE_LOG_DIR: /data/logs
    volumes:
      - mote-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mote-data:
    name: ${MOTE_VOLUME:?Profile-specific volume is required}
