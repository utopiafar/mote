name: 问题反馈
description: 报告采集、同步、部署或查询故障
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 版本与平台
      description: Mote 版本、客户端平台/系统版本、中央节点运行环境。
      placeholder: Mote 版本 · macOS / Android / Web
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与部署方式
      description: 例如 dev / test / prod / legacy，Node.js 或 Docker；无需提供 IP、用户名或目录。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
      description: 描述操作、实际结果和预期行为；最好使用合成输入复现。
      placeholder: |
        复现步骤：
        1.

        实际结果：

        预期结果：
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断线索
      description: 可选填错误类别、发生时间、请求编号，也可在此粘贴或上传图片、日志和导出的诊断包。附件会公开，请先检查并遮盖个人内容；不要上传私人归档、访问令牌或 API 密钥。
