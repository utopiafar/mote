name: Component checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: component-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  affected:
    runs-on: ubuntu-24.04
    outputs:
      central: ${{ steps.affected.outputs.central }}
      desktop: ${{ steps.affected.outputs.desktop }}
      android: ${{ steps.affected.outputs.android }}
      protocol: ${{ steps.affected.outputs.protocol }}
      tooling: ${{ steps.affected.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - id: affected
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$CHECK_EVENT" = workflow_dispatch ]; then
            node scripts/release/affected-components.mjs --all
          else
            node scripts/release/affected-components.mjs --base "$CHECK_BASE" --head "$CHECK_HEAD"
          fi
  contracts-and-release-tools:
    needs: affected
    if: needs.affected.outputs.central == 'true' || needs.affected.outputs.desktop == 'true' || needs.affected.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run check:i18n && npm run build -w @mote/shared && npm run test -w @mote/shared
      - run: node --test scripts/release/*.test.mjs
  central:
    needs: affected
    if: needs.affected.outputs.central == 'true'
    runs-on: ubuntu-24.04
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build:libs
      - run: npm run typecheck -w @mote/server -w @mote/web
      - run: npm run build -w @mote/server -w @mote/web
      - run: npm run test -w @mote/agent -w @mote/server -w @mote/web
      - run: node --test scripts/update-tests.mjs scripts/update-deployment-tests.mjs
  desktop:
    needs: affected
    if: needs.affected.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build -w @mote/shared -w @mote/diagnostics && npm run typecheck -w @mote/desktop
      - run: npm run test -w @mote/diagnostics -w @mote/desktop
  android:
    needs: affected
    if: needs.affected.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: apps/android/gradlew -p apps/android --no-daemon :app:testDebugUnitTest
