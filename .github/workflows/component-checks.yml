name: Component checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  # Main gets a unique group: pending runs cannot replace an earlier before..head range.
  group: component-checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  affected:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      node: ${{ steps.affected.outputs.node }}
      android: ${{ steps.affected.outputs.android }}
      server_groups: ${{ steps.affected.outputs.server_groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - id: baseline
        if: github.event_name == 'push'
        env:
          CHECK_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-base.mjs
      - id: affected
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || steps.baseline.outputs.base }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/select.mjs --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD"
  regressions:
    needs: affected
    if: needs.affected.outputs.node == 'true'
    name: Light / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Build the pinned Mem0 SQLite runtime for server fixtures
        if: startsWith(matrix.task, 'server-') && matrix.task != 'server-build'
        run: npm rebuild better-sqlite3
      - env:
          CHECK_TASK: ${{ matrix.task }}
          CHECK_SERVER_GROUPS: ${{ needs.affected.outputs.server_groups }}
        run: node scripts/ci/run.mjs --task "$CHECK_TASK"
  android:
    needs: affected
    if: needs.affected.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: apps/android/gradlew -p apps/android --no-daemon :app:testDebugUnitTest
  required-checks:
    name: Required checks
    if: always()
    needs: [affected, regressions, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - env:
          CHECK_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
