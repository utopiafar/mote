name: Release Android
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Branch build profile (release tags always use prod)'
        type: choice
        options: [dev, prod]
        default: dev
      publish:
        description: 'Publish after signing (disable for an artifact-only device validation build)'
        type: boolean
        default: true
env:
  MOTE_BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || inputs.profile || 'dev' }}
  MOTE_ANDROID_DEV_RUN: ${{ github.run_number }}
permissions:
  contents: read
concurrency:
  group: mote-release-android-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'dev' }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      profile: ${{ steps.version.outputs.profile }}
      build_id: ${{ steps.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - id: version
        run: npm run release:verify -- android
  package:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare persistent signing identity
        env:
          MOTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOTE_ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/release/prepare-android-signing.mjs
      - name: Test the selected Android profile
        env:
          MOTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOTE_ANDROID_KEYSTORE_PASSWORD }}
          MOTE_ANDROID_KEY_ALIAS: ${{ secrets.MOTE_ANDROID_KEY_ALIAS }}
          MOTE_ANDROID_KEY_PASSWORD: ${{ secrets.MOTE_ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          if [ "$MOTE_BUILD_PROFILE" = dev ]; then
            ./gradlew --no-daemon testDevelopmentUnitTest
          else
            ./gradlew --no-daemon testReleaseUnitTest
          fi
      - name: Build and sign the selected Android profile
        env:
          MOTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOTE_ANDROID_KEYSTORE_PASSWORD }}
          MOTE_ANDROID_KEY_ALIAS: ${{ secrets.MOTE_ANDROID_KEY_ALIAS }}
          MOTE_ANDROID_KEY_PASSWORD: ${{ secrets.MOTE_ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          if [ "$MOTE_BUILD_PROFILE" = dev ]; then
            ./gradlew --no-daemon assembleDevelopment
          else
            ./gradlew --no-daemon assembleRelease
          fi
      - name: Verify actual APK identities and 16 KiB alignment
        run: |
          if [ "$MOTE_BUILD_PROFILE" = dev ]; then
            node scripts/release/asset-metadata.mjs android apps/android/app/build/outputs/apk/development/app-development.apk
          else
            node scripts/release/asset-metadata.mjs android apps/android/app/build/outputs/apk/release/app-release.apk
          fi
      - name: Remove runner signing material
        if: always()
        run: node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP,'mote-release-signing'),{recursive:true,force:true})"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release/*, if-no-files-found: error, retention-days: 7 }
  publish:
    if: needs.version.outputs.profile == 'prod' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: [version, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release }
      - name: Publish verified android Beta or stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs android
  publish-dev:
    if: needs.version.outputs.profile == 'dev' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: [version, package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "${{ needs.version.outputs.build_id }}", path: artifacts/release }
      - name: Publish immutable Android Dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish-android-dev.mjs
