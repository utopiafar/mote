name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol-and-app-tests:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:libs
      - run: npm run typecheck
      - run: npm run build -w @mote/server -w @mote/web
      - run: npm test
      - run: npm run test:privacy
      - run: npm run test:e2e
      - run: npm run test:profiles
      - run: python3 -m unittest discover -s scripts -p "test_fact_archive.py"
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build and verify temporary Docker containers
        run: node scripts/test-container.mjs
      - name: Verify isolated Compose profiles, backup and rollback
        run: node scripts/test-profiles-container.mjs
