name: Release Central
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [dev, prod]
        default: dev
      verify:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  selected-file-task-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', MOTE_BUILD_PROFILE: dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build:central
      - run: node scripts/profile-selected-file.mjs
