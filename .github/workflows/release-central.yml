name: Release Central
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [dev, prod]
        default: dev
      verify:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  generated-memory-health-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sample: [health-1, health-2, conversation]
    name: Generated checks (${{ matrix.sample }})
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1', MOTE_BUILD_PROFILE: dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build:central
      - if: matrix.sample != 'conversation'
        run: node --import tsx --test --test-timeout=120000 apps/server/test/memory-processing-health.test.ts
      - if: matrix.sample == 'conversation'
        run: node --import tsx --test --test-timeout=120000 apps/server/test/assistant-task-journey.test.ts
