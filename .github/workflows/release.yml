name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mote-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - id: version
        run: node scripts/release/verify-version.mjs
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
  mac:
    needs: version
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run models:setup && npm run build:libs
      - name: Build and verify Mac application
        env:
          MOTE_MAC_SIGNING_MODE: ${{ vars.MOTE_MAC_SIGNING_MODE || 'adhoc' }}
          CSC_LINK: ${{ secrets.MOTE_MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MOTE_MAC_CERTIFICATE_PASSWORD }}
          MOTE_APPLE_TEAM_ID: ${{ vars.MOTE_APPLE_TEAM_ID }}
          MOTE_APPLE_API_KEY_P8: ${{ secrets.MOTE_APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.MOTE_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MOTE_APPLE_API_ISSUER }}
        run: |
          MOTE_MAC_DEVELOPMENT=1 node scripts/release/mac-package.mjs
      - name: Verify native replacement and startup rollback with generated apps
        run: node apps/desktop/scripts/update-fixture.cjs
      # mac-package builds desktop dist and the native helpers after models:setup.
      # These fixtures use temporary profiles and generated content only.
      - name: Build central server and web for generated integration fixtures
        run: npm run build -w @mote/server -w @mote/web
      - name: Verify desktop navigation, settings and composed input with generated data
        timeout-minutes: 5
        run: |
          node_modules/.bin/electron apps/desktop/scripts/i18n-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/ui-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/ui-page-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/client-improvements-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/complex-ui-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/content-storage-smoke.cjs
      - name: Verify offline first binding and explicit sync against a generated central node
        timeout-minutes: 5
        run: |
          node_modules/.bin/electron apps/desktop/scripts/offline-sync-smoke.cjs
          node_modules/.bin/electron apps/desktop/scripts/capture-browser-smoke.cjs
      - name: Verify central navigation, settings drafts and sync status with generated data
        timeout-minutes: 5
        run: |
          node_modules/.bin/electron scripts/test-web-i18n.cjs
          node_modules/.bin/electron scripts/test-model-profiles-ui.cjs
          node_modules/.bin/electron scripts/test-web-login.cjs
          node_modules/.bin/electron scripts/test-web-navigation.cjs
          node_modules/.bin/electron scripts/test-web-content-storage.cjs
          node_modules/.bin/electron scripts/test-web-conversations.cjs
          node_modules/.bin/electron scripts/test-calendar-actions-ui.cjs
          node_modules/.bin/electron scripts/test-web-tasks-imports.cjs
          node_modules/.bin/electron apps/web/scripts/capture-browser-smoke.cjs
      - name: Verify client onboarding, central UI and update networking with generated data
        run: |
          node apps/desktop/scripts/connection-server-smoke.cjs
          node apps/desktop/scripts/file-evidence-smoke.cjs
          node scripts/test-upload-fairness.cjs
          node_modules/.bin/electron apps/desktop/scripts/connection-smoke.cjs
          node_modules/.bin/electron scripts/test-web-connections.cjs
          node_modules/.bin/electron scripts/test-web-metadata.cjs
          node apps/desktop/scripts/window-identity-smoke.mjs
          node_modules/.bin/electron apps/desktop/scripts/update-network-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-mac, path: artifacts/release/*, if-no-files-found: error, retention-days: 7 }
  android:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with: { packages: platform-tools }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: sh scripts/setup-vision.sh
      - name: Prepare persistent signing identity
        env:
          MOTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOTE_ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/release/prepare-android-signing.mjs
      - name: Test and sign Android DEV
        env:
          MOTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOTE_ANDROID_KEYSTORE_PASSWORD }}
          MOTE_ANDROID_KEY_ALIAS: ${{ secrets.MOTE_ANDROID_KEY_ALIAS }}
          MOTE_ANDROID_KEY_PASSWORD: ${{ secrets.MOTE_ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/android
          ./gradlew --no-daemon testDebugUnitTest lintDevelopment assembleDevelopment
      - name: Verify actual APK identities and 16 KiB alignment
        run: |
          node scripts/release/asset-metadata.mjs android apps/android/app/build/outputs/apk/development/app-development.apk
      - name: Remove runner signing material
        if: always()
        run: node -e "require('node:fs').rmSync(require('node:path').join(process.env.RUNNER_TEMP,'mote-release-signing'),{recursive:true,force:true})"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: release-android, path: artifacts/release/*, if-no-files-found: error, retention-days: 7 }
  publish:
    needs: [version, checks, mac, android]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24' }
      - run: npm ci --ignore-scripts && npm run build -w @mote/shared
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: release-*, path: artifacts/release, merge-multiple: true }
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/publish.mjs
